- insert:
    - id: search-mcp
      name: '@e-mate/dsh-plugin-search-mcp'
      config:
        defaultServer: tavily
        maxResults: 8
        searchTimeoutMs: 30000
        servers:
          - id: tavily
            kind: tavily
            credentialRef: TAVILY_API_KEY

- id: web
  config:
    searchProvider: search-mcp

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: false
  config:
    fetch: false
    searchTimeoutMs: 60000
    searchMaxResults: 50
