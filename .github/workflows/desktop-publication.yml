name: Produce protected e-Mate schema-2 signer result

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main source SHA of the local-flow run.
        required: true
        type: string
      control_key:
        description: Content-addressed canonical R2 key of the sealed signer control input.
        required: true
        type: string
      control_bytes:
        description: Exact sealed control input byte count.
        required: true
        type: string
      control_sha256:
        description: Exact sealed control input SHA-256.
        required: true
        type: string
      compatibility_run_id:
        description: Exact successful attempt-1 compatibility carrier run ID.
        required: true
        type: string
      compatibility_artifact_id:
        description: Exact compatibility carrier artifact ID verified by GitHub API.
        required: true
        type: string
      signing_input_request_bytes:
        description: Exact local signing-input owner request byte count.
        required: true
        type: string
      signing_input_request_sha256:
        description: Exact local signing-input owner request SHA-256.
        required: true
        type: string
      signing_input_receipt_bytes:
        description: Exact Cloudflare signing-input owner receipt byte count.
        required: true
        type: string
      signing_input_receipt_sha256:
        description: Exact Cloudflare signing-input owner receipt SHA-256.
        required: true
        type: string
      dispatch_request_sha256:
        description: Exact local protected-signer dispatch request SHA-256.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: e-mate-protected-schema2-signer-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  signer:
    name: Produce protected schema-2 signer control result
    environment: r2-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ORIGIN: https://pub-ada3f610c0234a76838f4e19fe2bb25e.r2.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Accept only one exact protected-main signing attempt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_KEY: ${{ inputs.control_key }}
          CONTROL_BYTES: ${{ inputs.control_bytes }}
          CONTROL_SHA256: ${{ inputs.control_sha256 }}
          COMPATIBILITY_RUN_ID: ${{ inputs.compatibility_run_id }}
          COMPATIBILITY_ARTIFACT_ID: ${{ inputs.compatibility_artifact_id }}
          SIGNING_INPUT_REQUEST_BYTES: ${{ inputs.signing_input_request_bytes }}
          SIGNING_INPUT_REQUEST_SHA256: ${{ inputs.signing_input_request_sha256 }}
          SIGNING_INPUT_RECEIPT_BYTES: ${{ inputs.signing_input_receipt_bytes }}
          SIGNING_INPUT_RECEIPT_SHA256: ${{ inputs.signing_input_receipt_sha256 }}
          DISPATCH_REQUEST_SHA256: ${{ inputs.dispatch_request_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = zyfjacksonchen-source/e-Mate-2.0.11
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "${GITHUB_REF_PROTECTED:-}" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/desktop-publication.yml@refs/heads/main"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          [[ "$CONTROL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CONTROL_KEY" = "desktop/control/schema2-signing/$SOURCE_SHA/$CONTROL_SHA256.emate-signing-control"
          [[ "$CONTROL_BYTES" =~ ^[1-9][0-9]*$ ]]
          (( CONTROL_BYTES <= 4311744545 ))
          [[ "$COMPATIBILITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$COMPATIBILITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNING_INPUT_REQUEST_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNING_INPUT_RECEIPT_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNING_INPUT_REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIGNING_INPUT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DISPATCH_REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git switch -C main "$GITHUB_SHA"
          test "$(git symbolic-ref --quiet --short HEAD)" = main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download and safely expand the exact canonical R2 control input
        env:
          CONTROL_KEY: ${{ inputs.control_key }}
          CONTROL_BYTES: ${{ inputs.control_bytes }}
          CONTROL_SHA256: ${{ inputs.control_sha256 }}
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/protected-signer-control.emate"
          run_root="$RUNNER_TEMP/protected-signer-run"
          test "$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-filesize "$CONTROL_BYTES" --write-out '%{http_code}' \
            "$R2_ORIGIN/$CONTROL_KEY" --output "$control")" = 200
          test "$(stat -c '%s' "$control")" = "$CONTROL_BYTES"
          test "$(sha256sum "$control" | cut -d' ' -f1)" = "$CONTROL_SHA256"
          node scripts/signing-control-bundle.mjs unpack --bundle "$control" --output "$run_root"
          echo "RUN_ROOT=$run_root" >> "$GITHUB_ENV"

      - name: Recreate the exact post-bundle dispatch request
        id: dispatch
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_KEY: ${{ inputs.control_key }}
          CONTROL_BYTES: ${{ inputs.control_bytes }}
          CONTROL_SHA256: ${{ inputs.control_sha256 }}
          COMPATIBILITY_RUN_ID: ${{ inputs.compatibility_run_id }}
          COMPATIBILITY_ARTIFACT_ID: ${{ inputs.compatibility_artifact_id }}
          SIGNING_INPUT_REQUEST_BYTES: ${{ inputs.signing_input_request_bytes }}
          SIGNING_INPUT_REQUEST_SHA256: ${{ inputs.signing_input_request_sha256 }}
          SIGNING_INPUT_RECEIPT_BYTES: ${{ inputs.signing_input_receipt_bytes }}
          SIGNING_INPUT_RECEIPT_SHA256: ${{ inputs.signing_input_receipt_sha256 }}
          DISPATCH_REQUEST_SHA256: ${{ inputs.dispatch_request_sha256 }}
        run: |
          set -euo pipefail
          node scripts/signer-transport.mjs materialize-dispatch \
            --run-root "$RUN_ROOT" \
            --source-sha "$SOURCE_SHA" \
            --control-key "$CONTROL_KEY" \
            --control-url "$R2_ORIGIN/$CONTROL_KEY" \
            --control-bytes "$CONTROL_BYTES" \
            --control-sha256 "$CONTROL_SHA256" \
            --compatibility-run-id "$COMPATIBILITY_RUN_ID" \
            --compatibility-artifact-id "$COMPATIBILITY_ARTIFACT_ID" \
            --signing-input-request-bytes "$SIGNING_INPUT_REQUEST_BYTES" \
            --signing-input-request-sha256 "$SIGNING_INPUT_REQUEST_SHA256" \
            --signing-input-receipt-bytes "$SIGNING_INPUT_RECEIPT_BYTES" \
            --signing-input-receipt-sha256 "$SIGNING_INPUT_RECEIPT_SHA256" \
            --dispatch-request-sha256 "$DISPATCH_REQUEST_SHA256"
          echo "immutable-request-sha256=$(sha256sum "$RUN_ROOT/publication/immutable-owner-request.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "immutable-receipt-sha256=$(sha256sum "$RUN_ROOT/publication/immutable-owner-receipt.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "compatibility-request-sha256=$(sha256sum "$RUN_ROOT/publication/compatibility-attestation-request.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hydrate only the two verified installers from canonical R2
        run: |
          set -euo pipefail
          RUN_ROOT="$RUN_ROOT" R2_ORIGIN="$R2_ORIGIN" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { isDeepStrictEqual } from 'node:util'
          const root = process.env.RUN_ROOT
          const manifest = JSON.parse(readFileSync(`${root}/signing-control-manifest.json`, 'utf8'))
          const run = JSON.parse(readFileSync(`${root}/run.json`, 'utf8'))
          const metadata = manifest.metadata
          const exact = (value, keys) => value && typeof value === 'object' && !Array.isArray(value)
            && Object.keys(value).sort().join() === [...keys].sort().join()
          const keys = ['schema_version', 'document_type', 'run_id', 'version', 'source_commit', 'transaction_mode',
            'reader_attestation', 'predecessors', 'hydrated_installers', 'disclosure']
          if (!exact(metadata, keys) || metadata.schema_version !== 1
            || metadata.document_type !== 'emate.local-protected-signer-control-input'
            || metadata.run_id !== run.run_id || metadata.version !== run.version
            || metadata.source_commit !== run.source_commit || !Array.isArray(metadata.hydrated_installers)
            || metadata.hydrated_installers.length !== 2) throw new Error('signing control hydration metadata is invalid')
          const reader = metadata.reader_attestation
          if (!exact(reader, ['source_mode', 'current_version', 'expected_status', 'installer'])
            || !['candidate', 'public-predecessor'].includes(reader.source_mode)
            || !/^\d+\.\d+\.\d+$/.test(reader.current_version)
            || !['up-to-date', 'update-available'].includes(reader.expected_status)
            || !exact(reader.installer, ['url', 'bytes', 'sha256'])
            || !reader.installer.url.startsWith(`${process.env.R2_ORIGIN}/desktop/releases/`)
            || !Number.isSafeInteger(reader.installer.bytes) || reader.installer.bytes <= 0
            || !/^[0-9a-f]{64}$/.test(reader.installer.sha256)) {
            throw new Error('signing control Reader attestation metadata is invalid')
          }
          if (!isDeepStrictEqual(reader, run.release_transaction?.reader_attestation)) {
            throw new Error('signing control Reader attestation drifted from the frozen transaction')
          }
          const names = {
            macos: `e-Mate-${run.version}-mac-universal.dmg`,
            windows: `e-Mate-${run.version}-win-x64-Setup.exe`,
          }
          const lines = []
          for (const platform of ['macos', 'windows']) {
            const item = metadata.hydrated_installers.find(candidate => candidate?.platform === platform)
            const key = `desktop/releases/v${run.version}/${run.source_commit}/${names[platform]}`
            if (!exact(item, ['platform', 'name', 'key', 'url', 'bytes', 'sha256']) || item.name !== names[platform]
              || item.key !== key || item.url !== `${process.env.R2_ORIGIN}/${key}`
              || !Number.isSafeInteger(item.bytes) || item.bytes <= 0 || !/^[0-9a-f]{64}$/.test(item.sha256)) {
              throw new Error(`signing control ${platform} hydration record is invalid`)
            }
            lines.push([platform, item.name, item.url, item.bytes, item.sha256].join('\t'))
          }
          writeFileSync(`${root}/hydrate-installers.tsv`, `${lines.join('\n')}\n`, { flag: 'wx', mode: 0o600 })
          writeFileSync(`${root}/reader-attestation.tsv`, [reader.source_mode, reader.current_version,
            reader.expected_status, reader.installer.url, reader.installer.bytes, reader.installer.sha256].join('\t') + '\n',
          { flag: 'wx', mode: 0o600 })
          NODE
          while IFS=$'\t' read -r platform name url bytes sha; do
            destination="$RUN_ROOT/artifacts/$platform/$name"
            test ! -e "$destination"
            test "$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-filesize "$bytes" --write-out '%{http_code}' \
              "$url" --output "$destination")" = 200
            test "$(stat -c '%s' "$destination")" = "$bytes"
            test "$(sha256sum "$destination" | cut -d' ' -f1)" = "$sha"
          done < "$RUN_ROOT/hydrate-installers.tsv"
          rm "$RUN_ROOT/hydrate-installers.tsv"

      - name: Sign the exact local Profile inputs without publishing
        id: profile
        env:
          EMATE_PROFILE_SIGNING_PRIVATE_KEY: ${{ secrets.EMATE_PROFILE_SIGNING_PRIVATE_KEY }}
          EMATE_PROFILE_SIGNING_KEY_ID: ${{ secrets.EMATE_PROFILE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/publish-profile-r2.mjs \
            --local-request "$RUN_ROOT/publication/immutable-owner-request.json" \
            --local-run-root "$RUN_ROOT" \
            --snapshot "$RUN_ROOT/profile-current-snapshot.json" \
            --local-output "$RUN_ROOT/profile-signing" \
            --local-compact-output "$RUNNER_TEMP/profile-compact"
          echo "aggregate-sha256=$(sha256sum "$RUN_ROOT/profile-signing/profile-component-aggregate.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Sign and attest the exact schema-2 Desktop manifest
        id: desktop
        uses: zyfjacksonchen-source/e-mate-desktop-publication/local-schema2@93c707e2b7d833db3df4ee0013455b905232e1f6
        env:
          EMATE_PROFILE_SIGNING_PRIVATE_KEY: ${{ secrets.EMATE_PROFILE_SIGNING_PRIVATE_KEY }}
        with:
          source-sha: ${{ inputs.source_sha }}
          run-root: ${{ env.RUN_ROOT }}
          immutable-request-path: ${{ env.RUN_ROOT }}/publication/immutable-owner-request.json
          immutable-request-sha256: ${{ steps.dispatch.outputs.immutable-request-sha256 }}
          immutable-receipt-path: ${{ env.RUN_ROOT }}/publication/immutable-owner-receipt.json
          immutable-receipt-sha256: ${{ steps.dispatch.outputs.immutable-receipt-sha256 }}
          compatibility-request-path: ${{ env.RUN_ROOT }}/publication/compatibility-attestation-request.json
          compatibility-request-sha256: ${{ steps.dispatch.outputs.compatibility-request-sha256 }}
          profile-aggregate-path: ${{ env.RUN_ROOT }}/profile-signing/profile-component-aggregate.json
          profile-aggregate-sha256: ${{ steps.profile.outputs.aggregate-sha256 }}
          compatibility-run-id: ${{ inputs.compatibility_run_id }}
          compatibility-artifact-id: ${{ inputs.compatibility_artifact_id }}
          signing-key-id: ${{ secrets.EMATE_PROFILE_SIGNING_KEY_ID }}

      - name: Verify the final manifest with the actual bundled 2.0.15+ Reader
        env:
          DESKTOP_RESULT: ${{ steps.desktop.outputs.artifact-path }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r source_mode current_version expected_status installer_url installer_bytes installer_sha256 \
            < "$RUN_ROOT/reader-attestation.tsv"
          if test "$source_mode" = candidate; then
            reader_dmg="$RUN_ROOT/artifacts/macos/e-Mate-$(node -p "require('$RUN_ROOT/run.json').version")-mac-universal.dmg"
          else
            reader_dmg="$RUNNER_TEMP/public-predecessor-reader.dmg"
            test "$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-filesize "$installer_bytes" --write-out '%{http_code}' \
              "$installer_url" --output "$reader_dmg")" = 200
          fi
          test "$(stat -c '%s' "$reader_dmg")" = "$installer_bytes"
          test "$(sha256sum "$reader_dmg" | cut -d' ' -f1)" = "$installer_sha256"
          command -v 7z
          reader_root="$RUNNER_TEMP/bundled-update-reader"
          mkdir "$reader_root"
          7z x -y -o"$reader_root" "$reader_dmg" >/dev/null
          mapfile -d '' readers < <(find "$reader_root" -type f \
            -path '*/e-Mate.app/Contents/Resources/app.asar.unpacked/lib/update-checker.js' -print0)
          test "${#readers[@]}" = 1
          node scripts/verify-desktop-update-reader.mjs \
            --reader "${readers[0]}" \
            --manifest "$DESKTOP_RESULT/desktop-release-signed.json" \
            --base-contract desktop/e-mate-desktop/base-contract.json \
            --source-mode "$source_mode" \
            --current-version "$current_version" \
            --expected-status "$expected_status" \
            --installer-url "$installer_url" \
            --installer-bytes "$installer_bytes" \
            --installer-sha256 "$installer_sha256" \
            --output "$DESKTOP_RESULT/desktop-update-reader-attestation.json"
          rm "$RUN_ROOT/reader-attestation.tsv"

      - name: Assemble the compact local-import-only signer result
        env:
          DESKTOP_RESULT: ${{ steps.desktop.outputs.artifact-path }}
        run: |
          set -euo pipefail
          test "${{ steps.desktop.outputs.status }}" = ready-for-main-local-flow-activation
          node scripts/signer-transport.mjs assemble \
            --run-root "$RUN_ROOT" \
            --desktop "$DESKTOP_RESULT" \
            --profile "$RUNNER_TEMP/profile-compact" \
            --output "$RUNNER_TEMP/protected-signer-result"
          test "$(find "$RUNNER_TEMP/protected-signer-result" -type f -printf '%P\n' | LC_ALL=C sort | paste -sd, -)" = \
            "cloudflare-plugin-handoff.json,cloudflare-publication-plan.json,desktop-release-signed.json,desktop-update-reader-attestation.json,profile-component-aggregate.json,profile-desired-state/darwin-arm64.json,profile-desired-state/darwin-x64.json,profile-desired-state/win32-x64.json,profile-publication-plan.json,profile-signer-result.json,signer-result-receipt.json"
          test "$(find "$RUNNER_TEMP/protected-signer-result" -type f | wc -l | tr -d ' ')" = 11

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e-mate-protected-schema2-signer-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/protected-signer-result
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
