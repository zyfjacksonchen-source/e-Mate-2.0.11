name: Release e-Mate Desktop

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Attempt-1 protected-main CI run that built the exact release bytes.
        required: true
        type: string
      source_sha:
        description: Exact protected-main source SHA accepted by that CI run.
        required: true
        type: string
      signer_run_id:
        description: Successful attempt-1 macOS signing run for the exact source.
        required: true
        type: string
      signed_macos_artifact_id:
        description: Exact e-mate-desktop-macos-signed-<source SHA> artifact ID.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: e-mate-desktop-release-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  manifest:
    name: Bind exact signed macOS and protected-main CI Windows bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'

      - run: corepack enable

      - name: Install the exact Desktop verifier closure
        working-directory: desktop
        run: yarn install --immutable

      - name: Accept only the exact attempt-1 protected-main CI producer
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SIGNER_RUN_ID: ${{ inputs.signer_run_id }}
          SIGNED_MACOS_ARTIFACT_ID: ${{ inputs.signed_macos_artifact_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = zyfjacksonchen-source/e-Mate-2.0.11
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "${GITHUB_REF_PROTECTED:-}" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/desktop-release.yml@refs/heads/main"
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNED_MACOS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          mkdir -p .release-inputs/evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > .release-inputs/evidence/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > .release-inputs/evidence/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100" > .release-inputs/evidence/artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNER_RUN_ID" > .release-inputs/evidence/signer-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNER_RUN_ID/jobs?per_page=100" > .release-inputs/evidence/signer-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNED_MACOS_ARTIFACT_ID" > .release-inputs/evidence/signed-macos-artifact.json
          plan_artifact_id="$(jq -er --arg name "e-mate-ci-plan-$SOURCE_SHA" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else error("expected one CI plan artifact") end' \
            .release-inputs/evidence/artifacts.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$plan_artifact_id/zip" > .release-inputs/evidence/ci-plan.zip
          macos_artifact_id="$(jq -er --arg name "e-mate-desktop-macos-$SOURCE_SHA" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else error("expected one CI macOS artifact") end' \
            .release-inputs/evidence/artifacts.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$macos_artifact_id" > .release-inputs/evidence/macos-ci-artifact.json
          echo "plan_artifact_id=$plan_artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download the unique CI plan
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.evidence.outputs.plan_artifact_id }}
          merge-multiple: true
          path: .release-inputs/evidence/plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Verify the shared formal RC evidence contract
        run: >-
          node scripts/release-candidate.mjs verify
          --source "${{ inputs.source_sha }}"
          --run-id "${{ inputs.ci_run_id }}"
          --run .release-inputs/evidence/run.json
          --jobs .release-inputs/evidence/jobs.json
          --artifacts .release-inputs/evidence/artifacts.json
          --plan .release-inputs/evidence/plan/ci-plan.json
          --plan-archive .release-inputs/evidence/ci-plan.zip

      - name: Download the exact accepted Base SDK
        uses: actions/download-artifact@v4
        with:
          name: e-mate-base-sdk-${{ inputs.source_sha }}
          path: .release-inputs/base-sdk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download the exact accepted staged Profile
        uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ inputs.source_sha }}
          path: .release-inputs/profile
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download the exact accepted Profile build receipt
        uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-build-receipt-${{ inputs.source_sha }}
          path: .release-inputs/profile-receipt
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download the exact accepted Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-windows-${{ inputs.source_sha }}
          path: .release-inputs/windows
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download the exact accepted macOS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-macos-${{ inputs.source_sha }}
          path: .release-inputs/macos
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download the exact signed and notarized macOS handoff
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.signed_macos_artifact_id }}
          merge-multiple: true
          path: .release-inputs/macos-signed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signer_run_id }}

      - name: Verify Base SDK, shared Desktop, Profile, and platform receipts
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          node scripts/base-sdk.mjs verify --directory .release-inputs/base-sdk
          jq -e '.files | any(.path | startswith("desktop/e-mate-desktop/lib/"))' .release-inputs/base-sdk/manifest.json >/dev/null
          node scripts/desktop-admission.mjs profile-build-receipt \
            --commit "$SOURCE_SHA" \
            --profile .release-inputs/profile \
            --inventory packages/dsh/profile/component-inventory.json \
            --base-contract desktop/e-mate-desktop/base-contract.json \
            --out .release-inputs/recomputed-profile-build-receipt.json
          cmp -s .release-inputs/profile-receipt/profile-build-receipt.json .release-inputs/recomputed-profile-build-receipt.json
          node scripts/stage-desktop-ci-artifact.mjs verify \
            --platform win32 --source-commit "$SOURCE_SHA" --ci-run-id "$CI_RUN_ID" \
            --base-contract desktop/e-mate-desktop/base-contract.json --directory .release-inputs/windows

      - name: Accept only the isolated signed macOS handoff
        run: >-
          node scripts/desktop-admission.mjs signed-macos
          --commit "${{ inputs.source_sha }}"
          --ci-run-id "${{ inputs.ci_run_id }}"
          --signer-run-id "${{ inputs.signer_run_id }}"
          --signer-artifact-id "${{ inputs.signed_macos_artifact_id }}"
          --release-version "$(node -p "require(process.argv[1]).version" ./desktop/e-mate-desktop/package.json)"
          --base-contract desktop/e-mate-desktop/base-contract.json
          --metadata .release-inputs/evidence
          --unsigned-macos .release-inputs/macos
          --signed-macos .release-inputs/macos-signed

      - name: Stage only the exact CI-produced installer bytes
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require(process.argv[1]).version" ./desktop/e-mate-desktop/package.json)"
          mkdir -p dist/desktop
          cp ".release-inputs/macos-signed/e-Mate-$version-mac-universal.dmg" dist/desktop/
          cp ".release-inputs/windows/e-Mate-$version-win-x64-Setup.exe" dist/desktop/
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Generate admission-pending Desktop artifact candidate
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SIGNER_RUN_ID: ${{ inputs.signer_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          node desktop/e-mate-desktop/scripts/desktop-release-manifest.ts
          candidate
          --mac dist/desktop/e-Mate-${{ steps.version.outputs.value }}-mac-universal.dmg
          --win dist/desktop/e-Mate-${{ steps.version.outputs.value }}-win-x64-Setup.exe
          --commit "$SOURCE_SHA"
          --mac-commit "$SOURCE_SHA"
          --win-commit "$SOURCE_SHA"
          --mac-run "$SIGNER_RUN_ID"
          --win-run "$CI_RUN_ID"
          --out dist/desktop/desktop-candidate.json

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-release-${{ inputs.source_sha }}
          path: |
            dist/desktop/desktop-candidate.json
            dist/desktop/e-Mate-${{ steps.version.outputs.value }}-mac-universal.dmg
            dist/desktop/e-Mate-${{ steps.version.outputs.value }}-win-x64-Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
