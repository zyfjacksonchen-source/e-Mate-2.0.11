name: Release e-Mate Desktop

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Prior build run whose successful profile and Windows artifacts may be reused by a macOS-only retry.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  reuse:
    if: ${{ inputs.reuse_run_id != '' }}
    name: Validate reusable profile and Windows artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.accepted.outputs.source_sha }}
    steps:
      - name: Accept only the prior run's successful unaffected jobs
        id: accepted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          [[ "$REUSE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID")"
          source_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<<"$run_json")"
          test "$source_sha" = "$GITHUB_SHA"
          test "$(jq -er .event <<<"$run_json")" = workflow_dispatch
          test "$(jq -er .path <<<"$run_json")" = .github/workflows/desktop-release.yml
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/jobs?per_page=100")"
          jq -e '.jobs | any(.name == "Build and verify the e-Mate profile" and .conclusion == "success")' <<<"$jobs_json" >/dev/null
          jq -e '.jobs | any(.name == "Build unsigned Windows x64 installer" and .conclusion == "success")' <<<"$jobs_json" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  profile:
    if: ${{ inputs.reuse_run_id == '' }}
    name: Build and verify the e-Mate profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin-*/pnpm-lock.yaml
            packages/dsh/profile/plugins/emate-shell/pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile
          pnpm build:harness
          pnpm check:target
          pnpm test
          corepack enable
          cd desktop
          yarn install --immutable
          yarn build:sdk
          cd ..
          node scripts/base-sdk.mjs emit --directory .release-cache/base-sdk
      - name: Stage the exact built e-Mate profile without development links
        run: node scripts/stage-desktop-profile-artifact.mjs
      - name: Bind the staged Profile bytes to the source and Base
        run: >-
          node scripts/desktop-admission.mjs
          profile-build-receipt
          --commit "$GITHUB_SHA"
          --profile .release-cache/profile-artifact
          --inventory packages/dsh/profile/component-inventory.json
          --base-contract desktop/e-mate-desktop/base-contract.json
          --out .release-cache/profile-build-receipt/profile-build-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: |
            .release-cache/profile-artifact/dsh/profile
            .release-cache/profile-artifact/dsh-plugin-*/lib
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-profile-build-receipt-${{ github.sha }}
          path: .release-cache/profile-build-receipt/profile-build-receipt.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-base-sdk-${{ github.sha }}
          path: .release-cache/base-sdk
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  windows:
    if: ${{ inputs.reuse_run_id == '' }}
    name: Build unsigned Windows x64 installer
    needs: profile
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: corepack enable
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-base-sdk-${{ github.sha }}
          path: .release-cache/base-sdk
      - name: Install and verify the exact Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk
      - name: Prepare the exact offline Windows Vision runtime
        run: python packages/dsh-plugin-vision-toolkit/scripts/prepare-wheels.py --root packages/dsh-plugin-vision-toolkit --targets win32-x64
      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}
      - working-directory: desktop
        run: yarn install --immutable
      - working-directory: desktop
        run: yarn dist:win
      - name: Resolve packaged desktop version
        id: version
        working-directory: desktop
        shell: bash
        run: |
          version="$(node -p "require(process.argv[1]).version" "./e-mate-desktop/package.json")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-windows-${{ github.sha }}
          path: desktop/e-mate-desktop/dist/e-Mate-${{ steps.version.outputs.value }}-win-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    if: ${{ always() && ((inputs.reuse_run_id == '' && needs.profile.result == 'success') || (inputs.reuse_run_id != '' && needs.reuse.result == 'success')) }}
    name: Build unsigned macOS universal disk image
    needs: [profile, reuse]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: corepack enable
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reuse_run_id != '' && format('e-mate-desktop-profile-{0}', needs.reuse.outputs.source_sha) || format('e-mate-desktop-profile-{0}', github.sha) }}
          path: packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_run_id != '' && inputs.reuse_run_id || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reuse_run_id != '' && format('e-mate-base-sdk-{0}', needs.reuse.outputs.source_sha) || format('e-mate-base-sdk-{0}', github.sha) }}
          path: .release-cache/base-sdk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_run_id != '' && inputs.reuse_run_id || github.run_id }}
      - name: Install and verify the exact Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk
      - name: Prepare the exact offline universal macOS Vision runtime
        run: python packages/dsh-plugin-vision-toolkit/scripts/prepare-wheels.py --root packages/dsh-plugin-vision-toolkit --targets darwin-arm64,darwin-x64
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}
      - working-directory: desktop
        run: yarn install --immutable
      - working-directory: desktop
        run: yarn dist:mac-unsigned-release
      - name: Resolve packaged desktop version
        id: version
        working-directory: desktop
        run: |
          version="$(node -p "require(process.argv[1]).version" "./e-mate-desktop/package.json")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-macos-${{ github.sha }}
          path: desktop/e-mate-desktop/dist/mac-unsigned-release/e-Mate-${{ steps.version.outputs.value }}-mac-universal.dmg
          if-no-files-found: error
          retention-days: 7

  manifest:
    if: ${{ always() && needs.macos.result == 'success' && ((inputs.reuse_run_id == '' && needs.windows.result == 'success') || (inputs.reuse_run_id != '' && needs.reuse.result == 'success')) }}
    name: Bind native artifacts to the release manifest
    needs: [reuse, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reuse_run_id != '' && format('e-mate-desktop-windows-{0}', needs.reuse.outputs.source_sha) || format('e-mate-desktop-windows-{0}', github.sha) }}
          path: dist/desktop
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.reuse_run_id != '' && inputs.reuse_run_id || github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-macos-${{ github.sha }}
          path: dist/desktop
      - name: Resolve manifest version
        id: version
        run: |
          version="$(node -p "require(process.argv[1]).version" "./desktop/e-mate-desktop/package.json")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Generate performance-pending Desktop artifact candidate
        run: >-
          node desktop/e-mate-desktop/scripts/desktop-release-manifest.ts
          candidate
          --mac dist/desktop/e-Mate-${{ steps.version.outputs.value }}-mac-universal.dmg
          --win dist/desktop/e-Mate-${{ steps.version.outputs.value }}-win-x64-Setup.exe
          --commit "$GITHUB_SHA"
          --mac-commit "$GITHUB_SHA"
          --win-commit "${{ inputs.reuse_run_id != '' && needs.reuse.outputs.source_sha || github.sha }}"
          --mac-run "$GITHUB_RUN_ID"
          --win-run "${{ inputs.reuse_run_id != '' && inputs.reuse_run_id || github.run_id }}"
          --out dist/desktop/desktop-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-release-${{ github.sha }}
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 30
