name: Release e-Mate Desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an already built and Computer Use-accepted artifact run to R2.
        required: true
        type: boolean
        default: false
      release_run_id:
        description: Successful build-only run ID containing the exact accepted installers; required only when publishing.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.publish && 'e-mate-desktop-r2-publication' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  profile:
    if: ${{ !inputs.publish }}
    name: Build and verify the e-Mate profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml
      - run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness run build
          pnpm check:target
          pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: |
            packages/dsh/profile
            packages/dsh-plugin-*/lib
            packages/dsh-plugin-browser/extension/dist
          if-no-files-found: error
          retention-days: 1

  windows:
    if: ${{ !inputs.publish }}
    name: Build unsigned Windows x64 installer
    needs: profile
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - run: corepack enable
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: packages
      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}
      - working-directory: desktop
        run: yarn install --immutable
      - working-directory: desktop
        run: yarn dist:win
      - name: Resolve packaged desktop version
        id: version
        working-directory: desktop
        shell: bash
        run: echo "value=$(node -p \"require('./e-mate-desktop/package.json').version\")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-windows-${{ github.sha }}
          path: desktop/e-mate-desktop/dist/e-Mate-${{ steps.version.outputs.value }}-win-x64-Setup.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    if: ${{ !inputs.publish }}
    name: Build unsigned macOS universal disk image
    needs: profile
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - run: corepack enable
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: packages
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}
      - working-directory: desktop
        run: yarn install --immutable
      - working-directory: desktop
        run: yarn dist:mac-unsigned-release
      - name: Resolve packaged desktop version
        id: version
        working-directory: desktop
        run: echo "value=$(node -p \"require('./e-mate-desktop/package.json').version\")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-macos-${{ github.sha }}
          path: desktop/e-mate-desktop/dist/mac-unsigned-release/e-Mate-${{ steps.version.outputs.value }}-mac-universal.dmg
          if-no-files-found: error
          retention-days: 7

  manifest:
    if: ${{ !inputs.publish }}
    name: Bind native artifacts to the release manifest
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-windows-${{ github.sha }}
          path: dist/desktop
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-macos-${{ github.sha }}
          path: dist/desktop
      - name: Resolve manifest version
        id: version
        run: echo "value=$(node -p \"require('./desktop/e-mate-desktop/package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Generate exact R2 release manifest
        run: >-
          node desktop/e-mate-desktop/scripts/desktop-release-manifest.ts
          --mac dist/desktop/e-Mate-${{ steps.version.outputs.value }}-mac-universal.dmg
          --win dist/desktop/e-Mate-${{ steps.version.outputs.value }}-win-x64-Setup.exe
          --commit "$GITHUB_SHA"
          --out dist/desktop/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-release-${{ github.sha }}
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 30

  r2:
    name: Publish immutable installers and activate latest.json
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: r2-publish
    steps:
      - name: Validate the accepted build-only run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -er .head_sha <<<"$run_json")" = "$GITHUB_SHA"
          test "$(jq -er .conclusion <<<"$run_json")" = success
          test "$(jq -er .event <<<"$run_json")" = workflow_dispatch
          test "$(jq -er .path <<<"$run_json")" = .github/workflows/desktop-release.yml
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-release-${{ github.sha }}
          path: dist/desktop
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}
      - name: Publish accepted desktop bytes to Cloudflare R2
        env:
          ECOREX_R2_ACCESS_KEY_ID: ${{ secrets.ECOREX_R2_ACCESS_KEY_ID }}
          ECOREX_R2_SECRET_ACCESS_KEY: ${{ secrets.ECOREX_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          ECOREX_R2_ACCOUNT_ID: ${{ secrets.ECOREX_R2_ACCOUNT_ID }}
          EMATE_ACCEPTED_SHA: ${{ vars.EMATE_S12_ACCEPTED_SHA }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EMATE_ACCEPTED_SHA"
          if [[ "$ECOREX_R2_ACCESS_KEY_ID" =~ ^[0-9a-fA-F]{32}$ ]] && [[ "$ECOREX_R2_SECRET_ACCESS_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            export AWS_ACCESS_KEY_ID="$ECOREX_R2_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$ECOREX_R2_SECRET_ACCESS_KEY"
          else
            api_token="$ECOREX_R2_ACCESS_KEY_ID"
            test "${#api_token}" -ge 40
            token_id=''
            for verify_url in \
              'https://api.cloudflare.com/client/v4/user/tokens/verify' \
              "https://api.cloudflare.com/client/v4/accounts/${ECOREX_R2_ACCOUNT_ID}/tokens/verify"; do
              response="$(curl --fail --silent --show-error --header "Authorization: Bearer $api_token" "$verify_url" || true)"
              candidate="$(jq -er 'select(.success == true) | .result.id | select(test("^[0-9a-fA-F]{32}$"))' <<<"$response" 2>/dev/null || true)"
              if [[ -n "$candidate" ]]; then
                token_id="$candidate"
                break
              fi
            done
            test "$token_id" != ''
            export AWS_ACCESS_KEY_ID="$token_id"
            export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$api_token" | sha256sum | cut -d' ' -f1)"
          fi
          unset ECOREX_R2_ACCESS_KEY_ID ECOREX_R2_SECRET_ACCESS_KEY
          endpoint="https://${ECOREX_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          bucket="emate-desktop-downloads"
          origin="https://pub-ada3f610c0234a76838f4e19fe2bb25e.r2.dev"
          version="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' dist/desktop/latest.json)"
          test "$(jq -er .source_commit dist/desktop/latest.json)" = "$GITHUB_SHA"
          prefix="desktop/releases/v${version}/${GITHUB_SHA}"
          for platform in darwin win32; do
            file="$(jq -er --arg platform "$platform" '.artifacts[$platform].url | split("/")[-1]' dist/desktop/latest.json)"
            if [[ "$platform" = darwin ]]; then suffix='mac-universal.dmg'; else suffix='win-x64-Setup.exe'; fi
            test "$file" = "e-Mate-${version}-${suffix}"
            test "$(jq -er --arg platform "$platform" '.artifacts[$platform].url' dist/desktop/latest.json)" = "$origin/$prefix/$file"
            path="dist/desktop/$file"
            bytes="$(stat -c %s "$path")"
            sha="$(sha256sum "$path" | cut -d' ' -f1)"
            test "$(jq -er --arg platform "$platform" '.artifacts[$platform].bytes' dist/desktop/latest.json)" = "$bytes"
            test "$(jq -er --arg platform "$platform" '.artifacts[$platform].sha256' dist/desktop/latest.json)" = "$sha"
            key="$prefix/$file"
            if aws --endpoint-url "$endpoint" s3api head-object --bucket "$bucket" --key "$key" > existing.json 2>/dev/null; then
              test "$(jq -r .ContentLength existing.json)" = "$bytes"
              test "$(jq -r .Metadata.sha256 existing.json)" = "$sha"
            else
              aws --endpoint-url "$endpoint" s3api put-object --bucket "$bucket" --key "$key" --body "$path" \
                --cache-control 'public,max-age=31536000,immutable' --metadata "sha256=$sha" >/dev/null
            fi
            curl --fail --silent --show-error --retry 6 --retry-all-errors "$origin/$key" -o public-artifact
            test "$(stat -c %s public-artifact)" = "$bytes"
            test "$(sha256sum public-artifact | cut -d' ' -f1)" = "$sha"
          done
          aws --endpoint-url "$endpoint" s3api put-object --bucket "$bucket" --key desktop/latest.json \
            --body dist/desktop/latest.json --content-type application/json --cache-control 'no-store' >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$origin/desktop/latest.json" -o public-latest.json
          cmp dist/desktop/latest.json public-latest.json
