name: Release e-Mate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an already built and accepted carrier run to a new immutable R2 prefix.
        required: true
        type: boolean
        default: false
      release_run_id:
        description: Successful build-only run ID containing the exact accepted carrier; required only when publishing.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.publish && 'e-mate-r2-publication' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    if: ${{ !inputs.publish }}
    name: Build and pack npm tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin-*/pnpm-lock.yaml
            packages/dsh/profile/plugins/emate-shell/pnpm-lock.yaml
            enterprise/pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml

      - name: Install exact workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir enterprise install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile

      - name: Build pinned DeepSeek Harness
        run: pnpm --dir upstream/deepseek-harness run build

      - name: Build and test
        run: |
          pnpm check:target
          pnpm test
          pnpm enterprise:check
          pnpm enterprise:test
          pnpm enterprise:build
          node --test scripts/release.test.mjs

      - name: Pack the release tarball
        run: |
          pnpm --filter @e-mate/dsh pack --pack-destination dist/npm
          version="$(node -p "require('./packages/dsh/package.json').version")"
          pnpm --dir upstream/deepseek-harness exec publint "../../dist/npm/e-mate-dsh-${version}.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-npm-tarball
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  clean-install:
    if: ${{ !inputs.publish }}
    name: Clean install ${{ matrix.platform }}
    needs: pack
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: e-mate-npm-tarball
          path: dist/npm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install tarballs with npm and run setup checks
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/e-mate-dsh-home
          EMATE_DESKTOP_DIR: ${{ runner.temp }}/Desktop
          EMATE_NO_OPEN: '1'
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/e-mate-prefix"
          tarballs=(dist/npm/e-mate-dsh-*.tgz)
          test "${#tarballs[@]}" = 1
          npm install --global --prefix "$prefix" --no-audit --no-fund "${tarballs[0]}"
          npm_root="$(npm root --global --prefix "$prefix")"
          cli="$npm_root/@e-mate/dsh/lib/bin.js"
          version="$(node -p "require(process.argv[1]).version" "$npm_root/@e-mate/dsh/package.json")"
          test -f "$cli"
          if [[ "$RUNNER_OS" == Windows ]]; then
            test -f "$prefix/e-mate.cmd"
          else
            test -x "$prefix/bin/e-mate"
          fi
          test "$(node "$cli" --version)" = "$version"
          if ! EMATE_STAGING_CHECK=1 node "$cli" setup --check --json > "$RUNNER_TEMP/e-mate-staging-check.json"; then
            cat "$RUNNER_TEMP/e-mate-staging-check.json"
            exit 1
          fi
          node "$cli" setup
          node "$cli" setup
          if ! node "$cli" setup --check --json > "$RUNNER_TEMP/e-mate-installed-check.json"; then
            cat "$RUNNER_TEMP/e-mate-installed-check.json"
            exit 1
          fi
          CHECK_PATH="$RUNNER_TEMP/e-mate-installed-check.json" node -e \
            "const r=require(process.env.CHECK_PATH); if(!r.ok) throw new Error(JSON.stringify(r.checks))"
          trap 'node "$cli" stop >/dev/null 2>&1 || true' EXIT
          if ! node "$cli" launch; then
            cat "$DSH_HOME/e-mate/logs/web.log"
            exit 1
          fi
          status_json="$(node "$cli" status)"
          health_url="$(EMATE_EXPECTED_VERSION="$version" node -e 'const v=JSON.parse(process.argv[1]); if(!v.running || !v.healthy || v.product!=="e-Mate" || v.version!==process.env.EMATE_EXPECTED_VERSION) throw new Error(JSON.stringify(v)); process.stdout.write(new URL("/api/e-mate/health", v.url).href)' "$status_json")"
          EMATE_EXPECTED_VERSION="$version" node -e 'fetch(process.argv[1]).then(async response => { const v=await response.json(); if(!response.ok || v.product!=="e-Mate" || v.version!==process.env.EMATE_EXPECTED_VERSION || v.profile!=="e-mate") throw new Error(JSON.stringify(v)) })' "$health_url"
          node "$cli" stop
          trap - EXIT

  evidence:
    if: ${{ !inputs.publish }}
    name: Verify release set and generate evidence
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: e-mate-npm-tarball
          path: dist/npm

      - name: Generate SHA256, manifest, SPDX and license inventory
        run: node scripts/release.mjs evidence --from dist/npm --out dist/release

      - name: Render the immutable candidate download page
        run: node scripts/render-download-page.mjs --commit "$GITHUB_SHA" --out dist/download-page/index.html

      - name: Verify generated evidence checksums
        run: |
          cd dist/npm && sha256sum -c ../release/SHA256SUMS
          cd ../release && sha256sum -c EVIDENCE_SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-release-candidate
          path: |
            dist/npm/*
            dist/release/*
            dist/download-page/index.html
          if-no-files-found: error
          retention-days: 7

  r2:
    name: Publish immutable R2 download objects
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: r2-publish
    concurrency:
      group: e-mate-r2-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate the accepted build-only run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -er .head_sha <<<"$run_json")" = "$GITHUB_SHA"
          test "$(jq -er .conclusion <<<"$run_json")" = success
          test "$(jq -er .event <<<"$run_json")" = workflow_dispatch
          test "$(jq -er .path <<<"$run_json")" = .github/workflows/release.yml

      - uses: actions/download-artifact@v4
        with:
          name: e-mate-release-candidate
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.release_run_id }}

      - name: Recheck candidate bytes
        run: |
          cd dist/npm && sha256sum -c ../release/SHA256SUMS
          cd ../release && sha256sum -c EVIDENCE_SHA256SUMS

      - name: Verify R2 client
        run: aws --version

      - name: Publish immutable release bytes to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ECOREX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ECOREX_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          ECOREX_R2_ACCOUNT_ID: ${{ secrets.ECOREX_R2_ACCOUNT_ID }}
          EMATE_R2_PUBLIC_ORIGIN: ${{ vars.EMATE_R2_PUBLIC_ORIGIN }}
          EMATE_ACCEPTED_SHA: ${{ vars.EMATE_S12_ACCEPTED_SHA }}
        run: node scripts/publish-r2.mjs --npm dist/npm --evidence dist/release --receipt dist/r2/r2-download-admission.json

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-r2-admission
          path: dist/r2/r2-download-admission.json
          if-no-files-found: error
          retention-days: 30
