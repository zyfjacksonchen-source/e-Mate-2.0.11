name: Coordinate e-Mate release admission

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main source commit to release.
        required: true
        type: string
      version:
        description: Exact e-Mate version recorded by the source.
        required: true
        type: string
      release_mode:
        description: Accepted release lane.
        required: true
        type: choice
        options: [base]
      macos_publication_mode:
        description: Exact macOS publication owner for every downstream release stage.
        required: true
        default: unsigned
        type: choice
        options: [unsigned, signed]
      website_public_origin:
        description: Exact HTTPS origin served through the website current symlink.
        required: true
        type: string
      website_expected_active_target:
        description: Literal absent, or the website owner's fresh exact current target under releases/.
        required: true
        type: string
      website_expected_active_index:
        description: Literal absent, or the fresh public current index identity as <bytes>:<sha256>.
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: e-mate-release-coordinator
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  EMATE_SOURCE: ${{ inputs.source_sha }}
  EMATE_VERSION: ${{ inputs.version }}

jobs:
  ci:
    name: Resolve exact protected-main CI
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.ci.outputs.ci_run_id }}
      profile_bootstrap: ${{ steps.plan.outputs.profile_bootstrap }}
      macos_artifact_id: ${{ steps.macos.outputs.artifact_id }}
      macos_artifact_digest: ${{ steps.macos.outputs.artifact_digest }}
      macos_artifact_bytes: ${{ steps.macos.outputs.artifact_bytes }}
      windows_artifact_id: ${{ steps.windows.outputs.artifact_id }}
      windows_artifact_digest: ${{ steps.windows.outputs.artifact_digest }}
      windows_artifact_bytes: ${{ steps.windows.outputs.artifact_bytes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Require the exact protected release source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = zyfjacksonchen-source/e-Mate-2.0.11
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EMATE_SOURCE" = "$GITHUB_SHA"
          test "$EMATE_VERSION" = "$(node -p "require('./desktop/e-mate-desktop/package.json').version")"
          test "${{ inputs.release_mode }}" = base
          test "${{ inputs.macos_publication_mode }}" = unsigned -o "${{ inputs.macos_publication_mode }}" = signed
      - id: ci
        run: node scripts/release-coordinator.mjs resolve-ci --source "$EMATE_SOURCE"
      - name: Download the executable CI plan
        uses: actions/download-artifact@v4
        with:
          name: e-mate-ci-plan-${{ inputs.source_sha }}
          path: accepted-ci-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci.outputs.ci_run_id }}
      - name: Accept only an exact RC plan
        id: plan
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          plan=accepted-ci-plan/ci-plan.json
          mkdir -p accepted-ci-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > accepted-ci-evidence/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > accepted-ci-evidence/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100" > accepted-ci-evidence/artifacts.json
          plan_artifact_id="$(jq -er --arg name "e-mate-ci-plan-$EMATE_SOURCE" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else error("expected one CI plan artifact") end' \
            accepted-ci-evidence/artifacts.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$plan_artifact_id/zip" > accepted-ci-evidence/ci-plan.zip
          node scripts/release-candidate.mjs verify \
            --source "$EMATE_SOURCE" --run-id "$CI_RUN_ID" \
            --run accepted-ci-evidence/run.json --jobs accepted-ci-evidence/jobs.json \
            --artifacts accepted-ci-evidence/artifacts.json --plan "$plan" \
            --plan-archive accepted-ci-evidence/ci-plan.zip
          echo "profile_bootstrap=$(jq -r .profile_bootstrap "$plan")" >> "$GITHUB_OUTPUT"
      - id: macos
        run: node scripts/release-coordinator.mjs artifact --run-id "${{ steps.ci.outputs.ci_run_id }}" --name "e-mate-desktop-macos-$EMATE_SOURCE"
      - id: windows
        run: node scripts/release-coordinator.mjs artifact --run-id "${{ steps.ci.outputs.ci_run_id }}" --name "e-mate-desktop-windows-$EMATE_SOURCE"

  profile:
    name: Prepare exact Profile bytes
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}
      artifact_bytes: ${{ steps.artifact.outputs.artifact_bytes }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - id: run
        run: >-
          node scripts/release-coordinator.mjs dispatch --source "$EMATE_SOURCE"
          --workflow profile-release.yml
          --inputs '{"ci_run_id":"${{ needs.ci.outputs.run_id }}","bootstrap":"${{ needs.ci.outputs.profile_bootstrap }}"}'
      - id: artifact
        run: node scripts/release-coordinator.mjs artifact --run-id "${{ steps.run.outputs.run_id }}" --name "e-mate-profile-native-cloudflare-publication-$EMATE_SOURCE"

  signer:
    name: Sign and notarize exact accepted macOS bytes
    needs: ci
    if: inputs.macos_publication_mode == 'signed'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}
      artifact_bytes: ${{ steps.artifact.outputs.artifact_bytes }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - id: run
        run: >-
          node scripts/release-coordinator.mjs dispatch --source "$EMATE_SOURCE"
          --workflow desktop-macos-signing.yml
          --inputs '{"source_sha":"${{ inputs.source_sha }}","ci_run_id":"${{ needs.ci.outputs.run_id }}","macos_artifact_id":"${{ needs.ci.outputs.macos_artifact_id }}"}'
      - id: artifact
        run: node scripts/release-coordinator.mjs artifact --run-id "${{ steps.run.outputs.run_id }}" --name "e-mate-desktop-macos-signed-$EMATE_SOURCE"

  desktop:
    name: Bind exact selected macOS and CI Windows bytes
    needs: [ci, signer]
    if: always() && needs.ci.result == 'success' && (inputs.macos_publication_mode == 'unsigned' || needs.signer.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}
      artifact_bytes: ${{ steps.artifact.outputs.artifact_bytes }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - id: run
        run: |
          set -euo pipefail
          if test "${{ inputs.macos_publication_mode }}" = unsigned; then
            inputs="$(jq -nc \
              --arg ci "${{ needs.ci.outputs.run_id }}" --arg source "${{ inputs.source_sha }}" \
              --arg artifact "${{ needs.ci.outputs.macos_artifact_id }}" \
              '{ci_run_id:$ci,source_sha:$source,macos_publication_mode:"unsigned",macos_unsigned_artifact_id:$artifact}')"
          else
            inputs="$(jq -nc \
              --arg ci "${{ needs.ci.outputs.run_id }}" --arg source "${{ inputs.source_sha }}" \
              --arg signer "${{ needs.signer.outputs.run_id }}" --arg artifact "${{ needs.signer.outputs.artifact_id }}" \
              '{ci_run_id:$ci,source_sha:$source,macos_publication_mode:"signed",signer_run_id:$signer,signed_macos_artifact_id:$artifact}')"
          fi
          node scripts/release-coordinator.mjs dispatch --source "$EMATE_SOURCE" \
            --workflow desktop-release.yml --inputs "$inputs"
      - id: artifact
        run: node scripts/release-coordinator.mjs artifact --run-id "${{ steps.run.outputs.run_id }}" --name "e-mate-desktop-release-$EMATE_SOURCE"

  admission:
    name: Admit exact release bytes
    needs: [ci, profile, signer, desktop]
    if: always() && needs.ci.result == 'success' && needs.profile.result == 'success' && needs.desktop.result == 'success' && (inputs.macos_publication_mode == 'unsigned' || needs.signer.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}
      artifact_bytes: ${{ steps.artifact.outputs.artifact_bytes }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - id: run
        run: |
          set -euo pipefail
          common="$(jq -nc \
            --arg ci "${{ needs.ci.outputs.run_id }}" --arg desktop_run "${{ needs.desktop.outputs.run_id }}" \
            --arg desktop_artifact "${{ needs.desktop.outputs.artifact_id }}" \
            --arg profile_run "${{ needs.profile.outputs.run_id }}" --arg profile_artifact "${{ needs.profile.outputs.artifact_id }}" \
            '{ci_run_id:$ci,desktop_run_id:$desktop_run,desktop_artifact_id:$desktop_artifact,profile_release_run_id:$profile_run,profile_artifact_id:$profile_artifact}')"
          if test "${{ inputs.macos_publication_mode }}" = unsigned; then
            inputs="$(jq -c --arg artifact "${{ needs.ci.outputs.macos_artifact_id }}" \
              '. + {macos_publication_mode:"unsigned",macos_unsigned_artifact_id:$artifact}' <<<"$common")"
          else
            inputs="$(jq -c --arg signer "${{ needs.signer.outputs.run_id }}" --arg artifact "${{ needs.signer.outputs.artifact_id }}" \
              '. + {macos_publication_mode:"signed",signer_run_id:$signer,signed_macos_artifact_id:$artifact}' <<<"$common")"
          fi
          node scripts/release-coordinator.mjs dispatch --source "$EMATE_SOURCE" \
            --workflow desktop-admission.yml --inputs "$inputs"
      - id: artifact
        run: node scripts/release-coordinator.mjs artifact --run-id "${{ steps.run.outputs.run_id }}" --name "e-mate-desktop-admission-$EMATE_SOURCE"

  state:
    name: Freeze admitted release state
    needs: [ci, profile, signer, desktop, admission]
    if: always() && needs.ci.result == 'success' && needs.profile.result == 'success' && needs.desktop.result == 'success' && needs.admission.result == 'success' && (inputs.macos_publication_mode == 'unsigned' || needs.signer.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - name: Emit the Cloudflare-plugin handoff state
        env:
          EMATE_EXPECTED_VERSION: ${{ inputs.version }}
          CI_MACOS_ARTIFACT: ${{ needs.ci.outputs.macos_artifact_id }}
          CI_MACOS_DIGEST: ${{ needs.ci.outputs.macos_artifact_digest }}
          CI_MACOS_BYTES: ${{ needs.ci.outputs.macos_artifact_bytes }}
          SIGNED_MACOS_ARTIFACT: ${{ needs.signer.outputs.artifact_id }}
          SIGNED_MACOS_DIGEST: ${{ needs.signer.outputs.artifact_digest }}
          SIGNED_MACOS_BYTES: ${{ needs.signer.outputs.artifact_bytes }}
        run: |
          set -euo pipefail
          if test "${{ inputs.macos_publication_mode }}" = unsigned; then
            macos_run="${{ needs.ci.outputs.run_id }}"
            macos_artifact="$CI_MACOS_ARTIFACT"
            macos_digest="$CI_MACOS_DIGEST"
            macos_bytes="$CI_MACOS_BYTES"
          elif test "${{ inputs.macos_publication_mode }}" = signed; then
            macos_run="${{ needs.signer.outputs.run_id }}"
            macos_artifact="$SIGNED_MACOS_ARTIFACT"
            macos_digest="$SIGNED_MACOS_DIGEST"
            macos_bytes="$SIGNED_MACOS_BYTES"
          else
            exit 1
          fi
          node scripts/release-coordinator.mjs state \
            --source "$EMATE_SOURCE" --version "$EMATE_VERSION" --mode "${{ inputs.release_mode }}" \
            --macos-publication-mode "${{ inputs.macos_publication_mode }}" \
            --ci-run "${{ needs.ci.outputs.run_id }}" \
            --profile-run "${{ needs.profile.outputs.run_id }}" --profile-artifact "${{ needs.profile.outputs.artifact_id }}" --profile-digest "${{ needs.profile.outputs.artifact_digest }}" --profile-bytes "${{ needs.profile.outputs.artifact_bytes }}" \
            --desktop-run "${{ needs.desktop.outputs.run_id }}" --desktop-artifact "${{ needs.desktop.outputs.artifact_id }}" --desktop-digest "${{ needs.desktop.outputs.artifact_digest }}" --desktop-bytes "${{ needs.desktop.outputs.artifact_bytes }}" \
            --admission-run "${{ needs.admission.outputs.run_id }}" --admission-artifact "${{ needs.admission.outputs.artifact_id }}" --admission-digest "${{ needs.admission.outputs.artifact_digest }}" --admission-bytes "${{ needs.admission.outputs.artifact_bytes }}" \
            --macos-run "$macos_run" --macos-artifact "$macos_artifact" --macos-digest "$macos_digest" --macos-bytes "$macos_bytes" \
            --windows-run "${{ needs.ci.outputs.run_id }}" --windows-artifact "${{ needs.ci.outputs.windows_artifact_id }}" --windows-digest "${{ needs.ci.outputs.windows_artifact_digest }}" --windows-bytes "${{ needs.ci.outputs.windows_artifact_bytes }}" \
            --out release-state.json
      - run: test "$(jq -r .status release-state.json)" = admitted-awaiting-cloudflare-plugin
      - name: Emit the closed website publication handoff
        env:
          WEBSITE_PUBLIC_ORIGIN: ${{ inputs.website_public_origin }}
          WEBSITE_EXPECTED_ACTIVE_TARGET: ${{ inputs.website_expected_active_target }}
          WEBSITE_EXPECTED_ACTIVE_INDEX: ${{ inputs.website_expected_active_index }}
        run: >-
          node scripts/render-download-page.mjs
          --commit "$EMATE_SOURCE"
          --out website-handoff/download-page
          --plan website-handoff/website-publication-plan.json
          --release-state release-state.json
          --public-origin "$WEBSITE_PUBLIC_ORIGIN"
          --expected-active-target "$WEBSITE_EXPECTED_ACTIVE_TARGET"
          --expected-active-index "$WEBSITE_EXPECTED_ACTIVE_INDEX"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-release-state-${{ inputs.source_sha }}
          path: release-state.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-website-handoff-${{ inputs.source_sha }}
          path: website-handoff
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
