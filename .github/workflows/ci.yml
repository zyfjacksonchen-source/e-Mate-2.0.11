        run: yarn package:dir

      - name: Build and verify the formal unsigned universal disk image
        if: needs.impact.outputs.macos_distribution == 'true'
        working-directory: desktop
        run: yarn dist:mac-unsigned-release

      - name: Verify the source Loader and Profile owners once
        if: needs.impact.outputs.run_verification == 'true'
        working-directory: desktop/e-mate-desktop
        run: |
          yarn verify:loader
