name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check private update acceptance and gated promotion tools
        run: node --test desktop/e-mate-desktop/scripts/candidate-update-worker.test.mjs desktop/e-mate-desktop/scripts/launch-update-canary.test.mjs desktop/e-mate-desktop/scripts/verify-update-acceptance.test.mjs desktop/e-mate-desktop/scripts/candidate-promotion-worker.test.mjs
      - uses: pnpm/action-setup@v4
      - run: corepack enable
      - name: Build pinned Harness and bundled e-Mate Profile
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile
          pnpm build:harness
          pnpm build
      - working-directory: desktop
        run: yarn install --immutable
      - working-directory: desktop
        run: yarn workspace @e-mate/desktop check:source

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: corepack enable
      - name: Build pinned Harness and bundled e-Mate Profile
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile
          pnpm build:harness
          pnpm build
      - working-directory: desktop
        run: yarn install --immutable
      - working-directory: desktop
        run: yarn workspace @e-mate/desktop check:win-package

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: corepack enable
      - name: Build pinned Harness and bundled e-Mate Profile
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile
          pnpm build:harness
          pnpm build
      - working-directory: desktop
        run: yarn install --immutable
      - working-directory: desktop
        run: yarn workspace @e-mate/desktop check:mac-package
