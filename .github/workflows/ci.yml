name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  source:
    name: Node 24 / target contracts and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            enterprise/pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml

      - name: Install exact workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir enterprise install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile

      - name: Build pinned DeepSeek Harness
        run: pnpm --dir upstream/deepseek-harness run build

      - name: Check target pin and e-Mate behavior
        run: |
          pnpm check:target
          pnpm test
          pnpm enterprise:check
          pnpm enterprise:test
          pnpm enterprise:build

      - name: Check release carrier
        run: node --test scripts/release.test.mjs

      - name: Export the exact built e-Mate profile for desktop jobs
        uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: |
            packages/dsh/profile
            packages/dsh-plugin-*/lib
            packages/dsh-plugin-browser/extension/dist
          if-no-files-found: error
          retention-days: 1

      - name: Check patch whitespace
        run: git diff --check

  desktop-windows:
    name: Windows x64 / unsigned desktop installer
    needs: source
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'

      - run: corepack enable

      - name: Restore the profile built by the source gate
        uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: packages

      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}

      - name: Install the exact desktop closure
        working-directory: desktop
        run: yarn install --immutable

      - name: Build and verify the unsigned Windows installer
        working-directory: desktop
        run: yarn dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-2.0.9-windows-x64-unsigned
          path: |
            desktop/e-mate-desktop/dist/*.exe
            desktop/e-mate-desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    name: macOS universal / unsigned desktop disk image
    needs: source
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'

      - run: corepack enable

      - name: Restore the profile built by the source gate
        uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: packages

      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}

      - name: Install the exact desktop closure
        working-directory: desktop
        run: yarn install --immutable

      - name: Build and verify the unsigned universal disk image
        working-directory: desktop
        run: yarn dist:mac-smoke

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-2.0.9-macos-universal-unsigned
          path: desktop/e-mate-desktop/dist/mac-smoke/*
          if-no-files-found: error
          retention-days: 7
