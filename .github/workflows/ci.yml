            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/package.json', 'desktop/yarn.lock', 'desktop/.yarn/patches/**', 'desktop/e-mate-desktop/package.json', 'desktop/e-mate-desktop/scripts/package-dir.mjs', 'desktop/e-mate-desktop/scripts/package-mac-unsigned-release.ts', 'desktop/e-mate-desktop/scripts/verify-mac-release.ts', 'desktop/e-mate-desktop/build/app-icon-mac.png') }}

