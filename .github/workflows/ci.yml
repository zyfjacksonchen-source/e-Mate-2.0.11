  admission:
    name: CI admission
    if: always()
    needs: [impact, source, plugins, base-platform-components, profile-portable-composition, profile-composition, enterprise, desktop-windows, desktop-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Admit exactly the classified lane
        env:
          LANE: ${{ needs.impact.outputs.lane }}
          IMPACT: ${{ needs.impact.result }}
          SOURCE: ${{ needs.source.result }}
          PLUGINS: ${{ needs.plugins.result }}
          BASE_PLATFORM_COMPONENTS: ${{ needs.base-platform-components.result }}
          PROFILE_PORTABLE: ${{ needs.profile-portable-composition.result }}
          PROFILE: ${{ needs.profile-composition.result }}
          PUBLISH_COMPONENTS: ${{ needs.impact.outputs.publish_components_json }}
          PORTABLE_PUBLISH: ${{ needs.impact.outputs.portable_publish }}
          RUN_ENTERPRISE: ${{ needs.impact.outputs.run_enterprise }}
          ENTERPRISE: ${{ needs.enterprise.result }}
          RUN_WINDOWS_APP_SMOKE: ${{ needs.impact.outputs.windows_app_smoke }}
          RUN_MACOS_APP_SMOKE: ${{ needs.impact.outputs.macos_app_smoke }}
          WINDOWS: ${{ needs.desktop-windows.result }}
          MACOS: ${{ needs.desktop-macos.result }}
        run: |
          set -euo pipefail
          test "$IMPACT" = success
          case "$RUN_ENTERPRISE" in
            true) test "$ENTERPRISE" = success ;;
            false) test "$ENTERPRISE" = skipped ;;
            *) exit 1 ;;
          esac
          case "$RUN_WINDOWS_APP_SMOKE" in
            true) test "$WINDOWS" = success ;;
            false) test "$WINDOWS" = skipped ;;
            *) exit 1 ;;
          esac
          case "$RUN_MACOS_APP_SMOKE" in
            true) test "$MACOS" = success ;;
            false) test "$MACOS" = skipped ;;
            *) exit 1 ;;
          esac
          case "$LANE" in
            base)
              test "$SOURCE" = success
              test "$BASE_PLATFORM_COMPONENTS" = success
              test "$PLUGINS" = skipped
              test "$PROFILE_PORTABLE" = skipped
              test "$PROFILE" = skipped
              ;;
            plugin-only)
              test "$PLUGINS" = success
              if test "$PUBLISH_COMPONENTS" = '[]'; then
                test "$PROFILE_PORTABLE" = skipped
                test "$PROFILE" = skipped
              elif test "$PORTABLE_PUBLISH" = true; then
                test "$PROFILE_PORTABLE" = success
                test "$PROFILE" = skipped
              else
                test "$PROFILE_PORTABLE" = skipped
                test "$PROFILE" = success
              fi
              test "$SOURCE" = skipped
              test "$BASE_PLATFORM_COMPONENTS" = skipped
              ;;
            enterprise-only)
              test "$SOURCE" = skipped
              test "$PLUGINS" = skipped
              test "$PROFILE_PORTABLE" = skipped
              test "$PROFILE" = skipped
              test "$BASE_PLATFORM_COMPONENTS" = skipped
              ;;
            docs-only|verification-only|none)
              test "$SOURCE" = skipped
              test "$PLUGINS" = skipped
              test "$PROFILE_PORTABLE" = skipped
              test "$PROFILE" = skipped
              test "$BASE_PLATFORM_COMPONENTS" = skipped
              ;;
            *) exit 1 ;;
          esac
