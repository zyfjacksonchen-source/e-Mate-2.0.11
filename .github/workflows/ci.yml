name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Build the protected-main release candidate distributions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  impact:
    name: Release impact contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      run_base: ${{ steps.classify.outputs.run_base }}
      run_plugins: ${{ steps.classify.outputs.run_plugins }}
      run_enterprise: ${{ steps.classify.outputs.run_enterprise }}
      run_verification: ${{ steps.classify.outputs.run_verification }}
      components_json: ${{ steps.classify.outputs.components_json }}
      component_jobs_json: ${{ steps.classify.outputs.component_jobs_json }}
      ci_component_jobs_json: ${{ steps.classify.outputs.ci_component_jobs_json }}
      base_platform_component_jobs_json: ${{ steps.classify.outputs.base_platform_component_jobs_json }}
      ci_base_platform_component_jobs_json: ${{ steps.classify.outputs.ci_base_platform_component_jobs_json }}
      publish_components_json: ${{ steps.classify.outputs.publish_components_json }}
      portable_publish: ${{ steps.classify.outputs.portable_publish }}
      shared_runtime: ${{ steps.classify.outputs.shared_runtime }}
      profile: ${{ steps.classify.outputs.profile }}
      macos_runtime: ${{ steps.classify.outputs.macos_runtime }}
      macos_packaging: ${{ steps.classify.outputs.macos_packaging }}
      windows_runtime: ${{ steps.classify.outputs.windows_runtime }}
      windows_packaging: ${{ steps.classify.outputs.windows_packaging }}
      enterprise: ${{ steps.classify.outputs.enterprise }}
      release_verifier: ${{ steps.classify.outputs.release_verifier }}
      macos_app_smoke: ${{ steps.classify.outputs.macos_app_smoke }}
      windows_app_smoke: ${{ steps.classify.outputs.windows_app_smoke }}
      macos_distribution: ${{ steps.classify.outputs.macos_distribution }}
      windows_distribution: ${{ steps.classify.outputs.windows_distribution }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install impact test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test the fail-closed classifier and payload boundary
        run: node --test scripts/change-impact.test.mjs scripts/component-release.test.mjs scripts/profile-release.test.mjs scripts/publish-profile-r2.test.mjs

      - name: Classify the exact diff once
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PROTECTED_MAIN: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          RELEASE_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate }}
        run: |
          set -euo pipefail
          if test -z "$BASE_SHA"; then BASE_SHA="$(git rev-parse "$HEAD_SHA^")"; fi
          if test "$BASE_SHA" = 0000000000000000000000000000000000000000; then
            BASE_SHA="$(node --input-type=module -e "import { ACCEPTED_PREDECESSOR } from './scripts/change-impact.mjs'; process.stdout.write(ACCEPTED_PREDECESSOR)")"
          fi
          context_args=()
          if test "$PROTECTED_MAIN" = true; then context_args+=(--protected-main); fi
          if test "$RELEASE_CANDIDATE" = true; then context_args+=(--release-candidate); fi
          node scripts/change-impact.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            "${context_args[@]}" \
            --github-output "$GITHUB_OUTPUT" > change-impact.json
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-change-impact-${{ steps.classify.outputs.head_sha }}
          path: change-impact.json
          if-no-files-found: error
          retention-days: 7

  source:
    name: Node 24 / target contracts and unit tests
    needs: impact
    if: needs.impact.outputs.run_base == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Start job timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin-*/pnpm-lock.yaml
            packages/dsh/profile/plugins/emate-shell/pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml

      - name: Install exact workspaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile

      - name: Build pinned DeepSeek Harness
        run: pnpm build:harness

      - name: Check target pin and e-Mate behavior
        run: |
          pnpm check:target
          pnpm test

      - name: Check release carrier
        run: pnpm test:release

      - name: Resolve the immutable Base SDK cache key
        id: base-sdk-key
        run: echo "key=e-mate-base-sdk-$(node scripts/base-sdk.mjs fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore the immutable Base SDK cache
        id: base-sdk
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Build the accepted Desktop SDK carrier once
        if: steps.base-sdk.outputs.cache-hit != 'true'
        working-directory: desktop
        run: |
          corepack enable
          yarn install --immutable
          yarn build:sdk

      - name: Emit the immutable Base SDK
        if: steps.base-sdk.outputs.cache-hit != 'true'
        run: node scripts/base-sdk.mjs emit --directory .release-cache/base-sdk

      - name: Verify the restored immutable Base SDK
        if: steps.base-sdk.outputs.cache-hit == 'true'
        run: node scripts/base-sdk.mjs verify --directory .release-cache/base-sdk

      - name: Seed the immutable Base SDK cache
        if: steps.base-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Export the exact accepted Base SDK run artifact
        uses: actions/upload-artifact@v4
        with:
          name: e-mate-base-sdk-${{ needs.impact.outputs.head_sha }}
          path: .release-cache/base-sdk
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Stage the exact built e-Mate profile without development links
        run: node scripts/stage-desktop-profile-artifact.mjs

      - name: Bind the staged Profile bytes to the source and Base
        run: >-
          node scripts/desktop-admission.mjs
          profile-build-receipt
          --commit "$GITHUB_SHA"
          --profile .release-cache/profile-artifact
          --inventory packages/dsh/profile/component-inventory.json
          --base-contract desktop/e-mate-desktop/base-contract.json
          --out .release-cache/profile-build-receipt/profile-build-receipt.json

      - name: Export the exact built e-Mate profile for desktop jobs
        uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: |
            .release-cache/profile-artifact/dsh/profile
            .release-cache/profile-artifact/dsh-plugin-*/lib
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}

      - name: Export the Profile build receipt
        uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-profile-build-receipt-${{ github.sha }}
          path: .release-cache/profile-build-receipt/profile-build-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Check patch whitespace
        run: git diff --check

      - name: Summarize job timing
        if: always()
        env:
          STARTED: ${{ steps.timing.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          printf '### CI timing\n\n| Job | Seconds | Result |\n|---|---:|---|\n| Source | %s | %s |\n' "$elapsed" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  plugins:
    name: Changed Profile components / ${{ matrix.target }}
    needs: impact
    if: needs.impact.outputs.run_plugins == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact.outputs.ci_component_jobs_json) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin-*/pnpm-lock.yaml
            packages/dsh/profile/plugins/emate-shell/pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml

      - name: Prepare the exact component Python runtime
        id: component-python
        if: contains(matrix.components, '@e-mate/dsh-plugin-vision-toolkit')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node desktop/e-mate-desktop/scripts/prepare-python-runtime.mjs --target "$TARGET"
          relative="desktop/e-mate-desktop/build/python-runtime/$TARGET/python/bin/python3"
          if [[ "$TARGET" == win32-x64 ]]; then relative="desktop/e-mate-desktop/build/python-runtime/$TARGET/python/python.exe"; fi
          node -e 'const fs=require("node:fs"),p=require("node:path").resolve(process.argv[1]);if(!fs.existsSync(p))throw new Error(`missing ${p}`);process.stdout.write(`python=${p}\n`)' "$relative" >> "$GITHUB_OUTPUT"

      - name: Install exact component toolchains without building Harness
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter @e-mate/dsh-workspace
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile

      - name: Resolve the accepted Base SDK cache key
        id: base-sdk-key
        shell: bash
        run: echo "key=e-mate-base-sdk-$(node scripts/base-sdk.mjs fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore the accepted Base SDK
        id: base-sdk
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Refuse to rebuild a missing Base SDK in the plugin lane
        if: steps.base-sdk.outputs.cache-hit != 'true'
        run: |
          echo 'The accepted Base SDK cache is unavailable; seed it through a Base lane. Plugin CI will not rebuild Harness.' >&2
          exit 1

      - name: Restore and verify the accepted Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk

      - name: Build and test only the changed component
        shell: bash
        env:
          COMPONENTS_JSON: ${{ toJSON(matrix.components) }}
          EMATE_COMPONENT_TARGET: ${{ matrix.target }}
          EMATE_BUILD_PYTHON: ${{ steps.component-python.outputs.python }}
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            node scripts/component-run.mjs check --component "$component"
          done < <(node --input-type=module -e 'for (const id of JSON.parse(process.env.COMPONENTS_JSON)) console.log(id)')

      - name: Emit the immutable component payload
        if: toJSON(matrix.publish_components) != '[]'
        shell: bash
        env:
          PUBLISH_COMPONENTS_JSON: ${{ toJSON(matrix.publish_components) }}
          SOURCE_COMMIT: ${{ needs.impact.outputs.head_sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            slug="${component#@e-mate/}"
            target_args=()
            output="dist/components/$slug"
            if [[ "$TARGET" != portable ]]; then
              target_args=(--target "$TARGET")
              output="$output/$TARGET"
            fi
            node scripts/component-release.mjs emit \
              --component "$component" \
              --source-commit "$SOURCE_COMMIT" \
              "${target_args[@]}" \
              --out "$output"
          done < <(node --input-type=module -e 'for (const id of JSON.parse(process.env.PUBLISH_COMPONENTS_JSON)) console.log(id)')

      - uses: actions/upload-artifact@v4
        if: toJSON(matrix.publish_components) != '[]'
        with:
          name: e-mate-component-${{ strategy.job-index }}-${{ matrix.target }}-${{ needs.impact.outputs.head_sha }}
          path: dist/components
          if-no-files-found: error
          retention-days: 7

  base-platform-components:
    name: Base compatibility / ${{ matrix.target }}
    needs: [impact, source]
    if: needs.impact.outputs.run_base == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.impact.outputs.ci_base_platform_component_jobs_json) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/dsh-plugin-*/pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml

      - name: Prepare the exact component Python runtime
        id: component-python
        if: contains(matrix.components, '@e-mate/dsh-plugin-vision-toolkit')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node desktop/e-mate-desktop/scripts/prepare-python-runtime.mjs --target "$TARGET"
          relative="desktop/e-mate-desktop/build/python-runtime/$TARGET/python/bin/python3"
          if [[ "$TARGET" == win32-x64 ]]; then relative="desktop/e-mate-desktop/build/python-runtime/$TARGET/python/python.exe"; fi
          node -e 'const fs=require("node:fs"),p=require("node:path").resolve(process.argv[1]);if(!fs.existsSync(p))throw new Error(`missing ${p}`);process.stdout.write(`python=${p}\n`)' "$relative" >> "$GITHUB_OUTPUT"

      - name: Install exact platform component toolchains
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile

      - name: Resolve the newly built Base SDK cache key
        id: base-sdk-key
        shell: bash
        run: echo "key=e-mate-base-sdk-$(node scripts/base-sdk.mjs fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore the newly built Base SDK
        id: base-sdk
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Require the Base SDK produced by the source job
        if: steps.base-sdk.outputs.cache-hit != 'true'
        run: |
          echo 'The new Base SDK cache is unavailable; platform compatibility cannot use another Base.' >&2
          exit 1

      - name: Restore and verify the new Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk

      - name: Test the accepted platform component against the new Base
        shell: bash
        env:
          COMPONENTS_JSON: ${{ toJSON(matrix.components) }}
          EMATE_COMPONENT_TARGET: ${{ matrix.target }}
          EMATE_BUILD_PYTHON: ${{ steps.component-python.outputs.python }}
        run: |
          set -euo pipefail
          while IFS= read -r component; do
            node scripts/component-run.mjs check --component "$component"
          done < <(node --input-type=module -e 'for (const id of JSON.parse(process.env.COMPONENTS_JSON)) console.log(id)')

  profile-portable-composition:
    name: Portable Profile generations
    needs: [impact, plugins]
    if: needs.impact.outputs.run_plugins == 'true' && needs.impact.outputs.publish_components_json != '[]' && needs.impact.outputs.portable_publish == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: corepack enable

      - name: Install the exact composition dependency
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @e-mate/dsh-workspace

      - name: Resolve the accepted Base SDK cache key
        id: base-sdk-key
        shell: bash
        run: echo "key=e-mate-base-sdk-$(node scripts/base-sdk.mjs fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore the accepted Base SDK
        id: base-sdk
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Refuse to rebuild a missing Base SDK in the component lane
        if: steps.base-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo 'The accepted Base SDK cache is unavailable; seed it through a Base lane. Profile composition will not rebuild Desktop or Harness.' >&2
          exit 1

      - name: Restore and verify the accepted Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk

      - name: Download exactly the changed component payloads
        uses: actions/download-artifact@v4
        with:
          pattern: e-mate-component-*-${{ needs.impact.outputs.head_sha }}
          path: dist/components
          merge-multiple: true

      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: profile-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}

      - name: Install the exact Desktop runtime closure without building Base
        working-directory: desktop
        run: yarn install --immutable

      - name: Materialize the Cloudflare plugin desired-state snapshot
        run: >-
          node scripts/publish-profile-r2.mjs
          --snapshot artifacts/release/profile-current-snapshot.json
          --materialize-current dist/profile-current

      - name: Compose every target and boot the portable graph once
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.impact.outputs.head_sha }}
          PUBLISH_COMPONENTS_JSON: ${{ needs.impact.outputs.publish_components_json }}
        run: |
          set -euo pipefail
          changed_args=()
          while IFS= read -r component; do
            changed_args+=(--changed "$component")
          done < <(node --input-type=module -e 'for (const id of JSON.parse(process.env.PUBLISH_COMPONENTS_JSON)) console.log(id)')
          pids=()
          for target in darwin-arm64 darwin-x64 win32-x64; do
            (
              output="dist/profile-candidate/$target"
              node scripts/profile-release.mjs \
                --target "$target" \
                --artifact-root dist/components \
                "${changed_args[@]}" \
                --source-commit "$SOURCE_COMMIT" \
                --current "dist/profile-current/$target.json" \
                --out "$output"
            ) &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          test "$status" = 0
          output=dist/profile-candidate/darwin-arm64
          generation=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).candidate_generation)' "$output/admission.json")
          node desktop/e-mate-desktop/scripts/verify-profile-boot.mjs \
            --store "$output/store" \
            --generation "$generation" \
            --base "$output/verification-base.json" \
            --target darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-candidate-darwin-arm64-${{ needs.impact.outputs.head_sha }}
          path: |
            dist/profile-candidate/darwin-arm64/admission.json
            dist/profile-candidate/darwin-arm64/payload.json
            dist/profile-candidate/darwin-arm64/envelope.json
            dist/profile-candidate/darwin-arm64/verification-base.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-candidate-darwin-x64-${{ needs.impact.outputs.head_sha }}
          path: |
            dist/profile-candidate/darwin-x64/admission.json
            dist/profile-candidate/darwin-x64/payload.json
            dist/profile-candidate/darwin-x64/envelope.json
            dist/profile-candidate/darwin-x64/verification-base.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-candidate-win32-x64-${{ needs.impact.outputs.head_sha }}
          path: |
            dist/profile-candidate/win32-x64/admission.json
            dist/profile-candidate/win32-x64/payload.json
            dist/profile-candidate/win32-x64/envelope.json
            dist/profile-candidate/win32-x64/verification-base.json
          if-no-files-found: error
          retention-days: 7

  profile-composition:
    name: Complete Profile generation / ${{ matrix.target }}
    needs: [impact, plugins]
    if: needs.impact.outputs.run_plugins == 'true' && needs.impact.outputs.publish_components_json != '[]' && needs.impact.outputs.portable_publish != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - run: corepack enable

      - name: Resolve the accepted Base SDK cache key
        id: base-sdk-key
        shell: bash
        run: echo "key=e-mate-base-sdk-$(node scripts/base-sdk.mjs fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore the accepted Base SDK
        id: base-sdk
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true

      - name: Refuse to rebuild a missing Base SDK in the component lane
        if: steps.base-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo 'The accepted Base SDK cache is unavailable; seed it through a Base lane. Profile composition will not rebuild Desktop or Harness.' >&2
          exit 1

      - name: Restore and verify the accepted Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk

      - name: Download exactly the changed component payloads
        uses: actions/download-artifact@v4
        with:
          pattern: e-mate-component-*-${{ needs.impact.outputs.head_sha }}
          path: dist/components
          merge-multiple: true

      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: profile-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}

      - name: Install the exact Desktop runtime closure without building Base
        working-directory: desktop
        run: yarn install --immutable

      - name: Materialize the Cloudflare plugin desired-state snapshot
        run: >-
          node scripts/publish-profile-r2.mjs
          --snapshot artifacts/release/profile-current-snapshot.json
          --materialize-current dist/profile-current

      - name: Compose and boot the complete candidate generation
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ needs.impact.outputs.head_sha }}
          PUBLISH_COMPONENTS_JSON: ${{ needs.impact.outputs.publish_components_json }}
        run: |
          set -euo pipefail
          changed_args=()
          while IFS= read -r component; do
            changed_args+=(--changed "$component")
          done < <(node --input-type=module -e 'for (const id of JSON.parse(process.env.PUBLISH_COMPONENTS_JSON)) console.log(id)')
          output="dist/profile-candidate/$TARGET"
          node scripts/profile-release.mjs \
            --target "$TARGET" \
            --artifact-root dist/components \
            "${changed_args[@]}" \
            --source-commit "$SOURCE_COMMIT" \
            --current "dist/profile-current/$TARGET.json" \
            --out "$output"
          generation=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).candidate_generation)' "$output/admission.json")
          node desktop/e-mate-desktop/scripts/verify-profile-boot.mjs \
            --store "$output/store" \
            --generation "$generation" \
            --base "$output/verification-base.json" \
            --target "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-candidate-${{ matrix.target }}-${{ needs.impact.outputs.head_sha }}
          path: |
            dist/profile-candidate/${{ matrix.target }}/admission.json
            dist/profile-candidate/${{ matrix.target }}/payload.json
            dist/profile-candidate/${{ matrix.target }}/envelope.json
            dist/profile-candidate/${{ matrix.target }}/verification-base.json
          if-no-files-found: error
          retention-days: 7

  enterprise:
    name: Enterprise contracts
    needs: impact
    if: needs.impact.outputs.run_enterprise == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start job timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            enterprise
            package.json
          sparse-checkout-cone-mode: false
          submodules: false

      - name: Restore the two pinned e-Mate design assets used by Enterprise
        uses: actions/checkout@v6
        with:
          repository: zyfjacksonchen-source/EcoreX
          ref: 564a6b6c1d43fb6831dd4a5cd8026e472f063311
          path: upstream/e-mate-2.0.5
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            desktop/src/styles/tokens.css
            desktop/src/v1/assets/emate-logo.png
          sparse-checkout-cone-mode: false
          submodules: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: enterprise/pnpm-lock.yaml
      - run: pnpm --dir enterprise install --frozen-lockfile
      - run: |
          pnpm enterprise:check
          pnpm enterprise:test
          pnpm enterprise:build

      - name: Summarize job timing
        if: always()
        env:
          STARTED: ${{ steps.timing.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          printf '### CI timing\n\n| Job | Seconds | Result |\n|---|---:|---|\n| Enterprise | %s | %s |\n' "$elapsed" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  desktop-windows:
    name: Windows x64 / unsigned desktop installer
    needs: [impact, source]
    if: needs.impact.outputs.windows_app_smoke == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.release-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../e-mate-electron-builder
    steps:
      - name: Start job timing
        id: timing
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: corepack enable

      - name: Restore the profile built by the source gate
        uses: actions/download-artifact@v4
        with:
          name: e-mate-desktop-profile-${{ github.sha }}
          path: packages

      - name: Restore the exact Base SDK built by the source gate
        uses: actions/download-artifact@v4
        with:
          name: e-mate-base-sdk-${{ needs.impact.outputs.head_sha }}
          path: .release-cache/base-sdk

      - name: Install and verify the exact Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk

      - name: Prepare the exact offline Windows Vision runtime
        run: python packages/dsh-plugin-vision-toolkit/scripts/prepare-wheels.py --root packages/dsh-plugin-vision-toolkit --targets win32-x64

      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}

      - name: Restore Electron and electron-builder tool downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/package.json', 'desktop/yarn.lock', 'desktop/.yarn/patches/**', 'desktop/e-mate-desktop/package.json', 'desktop/e-mate-desktop/scripts/package-dir.mjs', 'desktop/e-mate-desktop/scripts/package-win.ts', 'desktop/e-mate-desktop/scripts/verify-win-installer.ts', 'desktop/e-mate-desktop/build/app-icon.png') }}

      - name: Install the exact desktop closure
        working-directory: desktop
        run: yarn install --immutable

      - name: Build and verify the Windows app directory
        if: needs.impact.outputs.windows_distribution != 'true'
        working-directory: desktop
        run: yarn package:dir

      - name: Build and verify the formal unsigned Windows installer
        if: needs.impact.outputs.windows_distribution == 'true'
        working-directory: desktop
        run: yarn dist:win

      - name: Verify the source Loader and Profile owners once
        if: needs.impact.outputs.run_verification == 'true'
        working-directory: desktop/e-mate-desktop
        run: |
          yarn verify:loader
          yarn verify:profile

      - name: Resolve the formal Desktop version
        if: needs.impact.outputs.windows_distribution == 'true'
        id: version
        shell: bash
        run: echo "value=$(node -p 'require(process.argv[1]).version' ./desktop/e-mate-desktop/package.json)" >> "$GITHUB_OUTPUT"

      - name: Stage only the verified formal Windows bytes
        if: needs.impact.outputs.windows_distribution == 'true'
        run: >-
          node scripts/stage-desktop-ci-artifact.mjs stage
          --platform win32
          --source-commit "${{ needs.impact.outputs.head_sha }}"
          --ci-run-id "${{ github.run_id }}"
          --base-contract desktop/e-mate-desktop/base-contract.json
          --source desktop/e-mate-desktop/dist
          --out .release-cache/desktop-ci/windows
          --version "${{ steps.version.outputs.value }}"

      - name: Export the exact formal Windows bytes
        if: needs.impact.outputs.windows_distribution == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-windows-${{ needs.impact.outputs.head_sha }}
          path: .release-cache/desktop-ci/windows
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Summarize job timing
        if: always()
        shell: bash
        env:
          STARTED: ${{ steps.timing.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          printf '### CI timing\n\n| Job | Seconds | Result |\n|---|---:|---|\n| Windows desktop | %s | %s |\n' "$elapsed" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  desktop-macos:
