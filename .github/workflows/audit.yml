name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 6'

permissions:
  contents: read

concurrency:
  group: e-mate-audit
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  audit:
    name: Full contracts and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Start audit timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Emit the only executable Audit plan
        id: plan
        run: |
          node scripts/change-impact.mjs --audit --github-output "$GITHUB_OUTPUT" > ci-plan.json
          test "$(jq -er .ci_mode ci-plan.json)" = audit
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-audit-ci-plan-${{ github.sha }}
          path: ci-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Install exact audit closures
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile
          pnpm --dir enterprise install --frozen-lockfile
          corepack enable
          yarn --cwd desktop install --immutable
      - name: Build the pinned Harness once
        run: pnpm build:harness
      - name: Run full repository contracts
        run: pnpm audit:full
      - name: Run Enterprise contracts
        run: |
          pnpm enterprise:check
          pnpm enterprise:test
          pnpm enterprise:build
      - name: Verify Desktop license closure
        working-directory: desktop/e-mate-desktop
        run: yarn verify:licenses
      - name: Summarize Audit timing
        if: always()
        env:
          STARTED: ${{ steps.timing.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          printf '### Audit timing\n\n| Lane | Seconds | Result |\n|---|---:|---|\n| Audit | %s | %s |\n' "$elapsed" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
