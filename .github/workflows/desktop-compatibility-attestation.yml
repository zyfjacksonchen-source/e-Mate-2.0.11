name: Materialize e-Mate schema-2 compatibility carrier

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main source SHA whose verified installers already exist on canonical R2.
        required: true
        type: string
      version:
        description: Exact frozen Desktop version from this source.
        required: true
        type: string
      macos_bytes:
        description: Exact canonical R2 DMG byte count from the immutable publication receipt.
        required: true
        type: string
      macos_sha256:
        description: Exact canonical R2 DMG SHA-256 from the immutable publication receipt.
        required: true
        type: string
      windows_bytes:
        description: Exact canonical R2 EXE byte count from the immutable publication receipt.
        required: true
        type: string
      windows_sha256:
        description: Exact canonical R2 EXE SHA-256 from the immutable publication receipt.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e-mate-schema2-compatibility-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  carrier:
    name: Materialize exact R2 bytes for the accepted 2.0.13 schema-2 parser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Accept only one exact protected-main materialization attempt
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          MACOS_BYTES: ${{ inputs.macos_bytes }}
          MACOS_SHA256: ${{ inputs.macos_sha256 }}
          WINDOWS_BYTES: ${{ inputs.windows_bytes }}
          WINDOWS_SHA256: ${{ inputs.windows_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = zyfjacksonchen-source/e-Mate-2.0.11
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "${GITHUB_REF_PROTECTED:-}" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/desktop-compatibility-attestation.yml@refs/heads/main"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MACOS_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$WINDOWS_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$MACOS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WINDOWS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(node -p "require(process.argv[1]).version" desktop/e-mate-desktop/package.json)" = "$VERSION"

      - name: Download and verify the exact immutable installers from canonical R2
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          MACOS_BYTES: ${{ inputs.macos_bytes }}
          MACOS_SHA256: ${{ inputs.macos_sha256 }}
          WINDOWS_BYTES: ${{ inputs.windows_bytes }}
          WINDOWS_SHA256: ${{ inputs.windows_sha256 }}
        run: |
          set -euo pipefail
          origin=https://pub-ada3f610c0234a76838f4e19fe2bb25e.r2.dev
          prefix="$origin/desktop/releases/v$VERSION/$SOURCE_SHA"
          mac="e-Mate-$VERSION-mac-universal.dmg"
          win="e-Mate-$VERSION-win-x64-Setup.exe"
          mkdir compatibility-carrier
          test "$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --write-out '%{http_code}' \
            "$prefix/$mac" --output "compatibility-carrier/$mac")" = 200
          test "$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --write-out '%{http_code}' \
            "$prefix/$win" --output "compatibility-carrier/$win")" = 200
          test "$(stat -c '%s' "compatibility-carrier/$mac")" = "$MACOS_BYTES"
          test "$(sha256sum "compatibility-carrier/$mac" | cut -d' ' -f1)" = "$MACOS_SHA256"
          test "$(stat -c '%s' "compatibility-carrier/$win")" = "$WINDOWS_BYTES"
          test "$(sha256sum "compatibility-carrier/$win" | cut -d' ' -f1)" = "$WINDOWS_SHA256"

      - name: Materialize the legacy schema-2 candidate with the actual carrier run ID
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node --experimental-strip-types desktop/e-mate-desktop/scripts/desktop-release-manifest.ts candidate \
            --mac "compatibility-carrier/e-Mate-$VERSION-mac-universal.dmg" \
            --win "compatibility-carrier/e-Mate-$VERSION-win-x64-Setup.exe" \
            --commit "$SOURCE_SHA" \
            --mac-commit "$SOURCE_SHA" \
            --win-commit "$SOURCE_SHA" \
            --mac-run "$GITHUB_RUN_ID" \
            --win-run "$GITHUB_RUN_ID" \
            --out compatibility-carrier/desktop-candidate.json
          test "$(find compatibility-carrier -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | paste -sd, -)" = \
            "desktop-candidate.json,e-Mate-$VERSION-mac-universal.dmg,e-Mate-$VERSION-win-x64-Setup.exe"
          test "$(find compatibility-carrier -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 3

      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-desktop-release-${{ inputs.source_sha }}
          path: compatibility-carrier
          include-hidden-files: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
