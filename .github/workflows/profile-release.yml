name: Prepare e-Mate Profile publication

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Attempt-1 protected-main RC run for the exact current main commit.
        required: true
        type: string
      bootstrap:
        description: Must exactly match the accepted CI plan profile_bootstrap field.
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: e-mate-profile-r2-publication
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate accepted CI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.run.outputs.source_sha }}
      publish_components_json: ${{ steps.plan.outputs.publish_components_json }}
      profile_bootstrap: ${{ steps.plan.outputs.profile_bootstrap }}
    steps:
      - name: Start validation timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Accept only successful RC evidence for the exact current main tree
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = zyfjacksonchen-source/e-Mate-2.0.11
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "${GITHUB_REF_PROTECTED:-}" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/profile-release.yml@refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p dist/accepted-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > dist/accepted-evidence/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > dist/accepted-evidence/jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100" > dist/accepted-evidence/artifacts.json
          run_json="$(cat dist/accepted-evidence/run.json)"
          source_sha="$(jq -er .head_sha <<<"$run_json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$source_sha" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$source_sha"
          plan_artifact_id="$(jq -er --arg name "e-mate-ci-plan-$source_sha" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else error("expected one CI plan artifact") end' \
            dist/accepted-evidence/artifacts.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$plan_artifact_id/zip" > dist/accepted-evidence/ci-plan.zip
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: e-mate-ci-plan-${{ steps.run.outputs.source_sha }}
          path: dist/accepted-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Match the accepted RC plan and completed build jobs
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          plan=dist/accepted-plan/ci-plan.json
          node scripts/release-candidate.mjs verify \
            --source "${{ steps.run.outputs.source_sha }}" --run-id "$CI_RUN_ID" \
            --run dist/accepted-evidence/run.json --jobs dist/accepted-evidence/jobs.json \
            --artifacts dist/accepted-evidence/artifacts.json --plan "$plan" \
            --plan-archive dist/accepted-evidence/ci-plan.zip
          base_id="$(jq -er .id desktop/e-mate-desktop/base-contract.json)"
          schedule_floor="$(jq -er .schedule_protocol_floor desktop/e-mate-desktop/base-contract.json)"
          test "$(jq -er .profile_bootstrap "$plan")" = "$BOOTSTRAP"
          test "$(jq -er .contract.base_contract_id "$plan")" = "$base_id"
          test "$(jq -er .contract.schedule_protocol_floor "$plan")" = "$schedule_floor"
          echo "publish_components_json=$(jq -c .publish_components "$plan")" >> "$GITHUB_OUTPUT"
          echo "profile_bootstrap=$(jq -r .profile_bootstrap "$plan")" >> "$GITHUB_OUTPUT"
      - name: Summarize validation timing
        if: always()
        env:
          STARTED: ${{ steps.timing.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          printf '### RC timing\n\n| Stage | Seconds | Result |\n|---|---:|---|\n| Validate exact CI artifacts | %s | %s |\n' "$elapsed" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  prepare-publication:
    name: Prepare signed native Cloudflare publication bundle
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: r2-publish
    steps:
      - name: Start bundle timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install only the publication dependency
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @e-mate/dsh-workspace

      - name: Download exact component payloads from accepted CI
        uses: actions/download-artifact@v4
        with:
          pattern: e-mate-component-*-${{ needs.validate.outputs.source_sha }}
          path: dist/components
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download accepted darwin-arm64 candidate
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-candidate-darwin-arm64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/darwin-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Download accepted darwin-x64 candidate
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-candidate-darwin-x64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/darwin-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Download accepted win32-x64 candidate
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-candidate-win32-x64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/win32-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Sign and stage immutable objects separately from activation pointers
        env:
          EMATE_PROFILE_SIGNING_PRIVATE_KEY: ${{ secrets.EMATE_PROFILE_SIGNING_PRIVATE_KEY }}
          EMATE_PROFILE_SIGNING_KEY_ID: ${{ secrets.EMATE_PROFILE_SIGNING_KEY_ID }}
          EMATE_PROFILE_BOOTSTRAP: ${{ needs.validate.outputs.profile_bootstrap }}
          EMATE_ACCEPTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EMATE_ACCEPTED_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          EXPECTED_CHANGED_COMPONENTS_JSON: ${{ needs.validate.outputs.publish_components_json }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 win32-x64; do
            test -f "dist/profile-candidates/$target/admission.json"
            test -f "dist/profile-candidates/$target/payload.json"
          done
          bootstrap_args=()
          if test "$EMATE_PROFILE_BOOTSTRAP" = true; then bootstrap_args=(--bootstrap); fi
          changed_args=()
          while IFS= read -r component; do changed_args+=(--changed "$component"); done < <(
            node --input-type=module -e 'for (const id of JSON.parse(process.env.EXPECTED_CHANGED_COMPONENTS_JSON)) console.log(id)'
          )
          node scripts/publish-profile-r2.mjs \
            --candidate dist/profile-candidates/darwin-arm64 \
            --candidate dist/profile-candidates/darwin-x64 \
            --candidate dist/profile-candidates/win32-x64 \
            --artifact-root dist/components \
            "${changed_args[@]}" \
            --snapshot artifacts/release/profile-current-snapshot.json \
            --bundle dist/profile-publication \
            "${bootstrap_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-native-cloudflare-publication-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-publication
          if-no-files-found: error
          retention-days: 30
      - name: Summarize bundle timing
        if: always()
        env:
          STARTED: ${{ steps.timing.outputs.started }}
        run: |
          elapsed=$(( $(date +%s) - STARTED ))
          printf '### RC timing\n\n| Stage | Seconds | Result |\n|---|---:|---|\n| Sign and stage Profile bundle | %s | %s |\n' "$elapsed" "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
