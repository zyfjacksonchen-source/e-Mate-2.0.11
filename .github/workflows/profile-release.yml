name: Release e-Mate Profile components

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run for this exact main commit (Base lane for bootstrap, plugin-only lane otherwise).
        required: true
        type: string
      bootstrap:
        description: Create the first complete signed Profile generation for the accepted 2.0.11 Base.
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: e-mate-profile-r2-publication
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    name: Validate accepted CI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.run.outputs.source_sha }}
      publish_components_json: ${{ steps.impact.outputs.publish_components_json }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Accept only a successful CI run for the current main commit
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          test "$(jq -er .head_sha <<<"$run_json")" = "$GITHUB_SHA"
          test "$(jq -er .head_branch <<<"$run_json")" = main
          test "$(jq -er .event <<<"$run_json")" = push
          test "$(jq -er .path <<<"$run_json")" = .github/workflows/ci.yml
          test "$(jq -er .conclusion <<<"$run_json")" = success
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: e-mate-change-impact-${{ steps.run.outputs.source_sha }}
          path: dist/accepted-impact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Match the accepted lane, jobs, and executable release boundary
        id: impact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          impact=dist/accepted-impact/change-impact.json
          base_id="$(jq -er .id desktop/e-mate-desktop/base-contract.json)"
          test "$(jq -er .contract.valid "$impact")" = true
          test "$(jq -er .contract.base_contract_id "$impact")" = "$base_id"
          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
          job_succeeded() {
            jq -e --arg name "$1" '.jobs | any(.name == $name and .conclusion == "success")' <<<"$jobs_json" >/dev/null
          }
          job_succeeded 'CI admission'
          if test "$BOOTSTRAP" = true; then
            test "$(jq -er .lane "$impact")" = base
            test "$(jq -c .publish_components "$impact")" = '[]'
            job_succeeded 'Node 24 / target contracts and unit tests'
            job_succeeded 'Windows x64 / unsigned desktop installer'
            job_succeeded 'macOS universal / unsigned desktop disk image'
          else
            test "$(jq -er .lane "$impact")" = plugin-only
            test "$(jq -er '.publish_components | length > 0' "$impact")" = true
            while IFS= read -r name; do job_succeeded "$name"; done < <(
              jq -r '.component_jobs[] | "Changed Profile component / \(.component) / \(.target)"' "$impact"
            )
            for target in darwin-arm64 darwin-x64 win32-x64; do
              job_succeeded "Complete Profile generation / $target"
            done
          fi
          echo "publish_components_json=$(jq -c .publish_components "$impact")" >> "$GITHUB_OUTPUT"

  bootstrap-plan:
    name: Resolve the complete accepted component matrix
    needs: validate
    if: inputs.bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      component_jobs_json: ${{ steps.plan.outputs.component_jobs_json }}
      components_json: ${{ steps.plan.outputs.components_json }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read the shared component inventory
        id: plan
        run: |
          set -euo pipefail
          node scripts/component-release.mjs inventory > component-inventory.json
          echo "component_jobs_json=$(jq -c .component_jobs component-inventory.json)" >> "$GITHUB_OUTPUT"
          echo "components_json=$(jq -c '[.components[] | select(.desktop != "blocked") | .id] | sort' component-inventory.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-bootstrap-plan-${{ needs.validate.outputs.source_sha }}
          path: component-inventory.json
          if-no-files-found: error
          retention-days: 30

  bootstrap-components:
    name: Bootstrap Profile component / ${{ matrix.component }} / ${{ matrix.target }}
    needs: [validate, bootstrap-plan]
    if: inputs.bootstrap
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.bootstrap-plan.outputs.component_jobs_json) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            upstream/deepseek-harness/pnpm-lock.yaml
      - name: Install exact component toolchains without building Base
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir upstream/deepseek-harness install --frozen-lockfile
      - name: Resolve the accepted Base SDK cache key
        id: base-sdk-key
        shell: bash
        run: echo "key=e-mate-base-sdk-$(node scripts/base-sdk.mjs fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore the accepted Base SDK
        id: base-sdk
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true
      - name: Refuse to rebuild a missing Base SDK
        if: steps.base-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo 'The accepted Base SDK cache is unavailable; bootstrap will not rebuild Desktop or Harness.' >&2
          exit 1
      - name: Restore and verify the accepted Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk
      - name: Build and test the target component
        env:
          COMPONENT: ${{ matrix.component }}
          EMATE_COMPONENT_TARGET: ${{ matrix.target }}
        run: |
          pnpm --filter "$COMPONENT" run build
          pnpm --filter "$COMPONENT" run test
      - name: Emit the immutable target payload
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          slug="${COMPONENT#@e-mate/}"
          target_args=()
          output="dist/bootstrap-components/$slug"
          if [[ "$TARGET" != portable ]]; then
            target_args=(--target "$TARGET")
            output="$output/$TARGET"
          fi
          node scripts/component-release.mjs emit \
            --component "$COMPONENT" \
            --source-commit "$SOURCE_COMMIT" \
            "${target_args[@]}" \
            --out "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-bootstrap-component-${{ strategy.job-index }}-${{ matrix.target }}-${{ needs.validate.outputs.source_sha }}
          path: dist/bootstrap-components
          if-no-files-found: error
          retention-days: 7

  bootstrap-composition:
    name: Bootstrap complete Profile generation / ${{ matrix.target }}
    needs: [validate, bootstrap-plan, bootstrap-components]
    if: inputs.bootstrap
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - name: Resolve the accepted Base SDK cache key
        id: base-sdk-key
        shell: bash
        run: echo "key=e-mate-base-sdk-$(node scripts/base-sdk.mjs fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore the accepted Base SDK
        id: base-sdk
        uses: actions/cache/restore@v4
        with:
          path: .release-cache/base-sdk
          key: ${{ steps.base-sdk-key.outputs.key }}
          enableCrossOsArchive: true
      - name: Refuse to rebuild a missing Base SDK
        if: steps.base-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo 'The accepted Base SDK cache is unavailable; composition will not rebuild Desktop or Harness.' >&2
          exit 1
      - name: Restore and verify the accepted Base SDK
        run: node scripts/base-sdk.mjs install --directory .release-cache/base-sdk
      - uses: actions/download-artifact@v4
        with:
          pattern: e-mate-profile-bootstrap-component-*-${{ needs.validate.outputs.source_sha }}
          path: dist/components
          merge-multiple: true
      - name: Resolve Yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(cd desktop && yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: profile-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/yarn.lock', 'desktop/.yarnrc.yml') }}
      - name: Install the exact Desktop runtime closure without building Base
        working-directory: desktop
        run: yarn install --immutable
      - name: Compose and boot every byte in the initial generation
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_sha }}
          COMPONENTS_JSON: ${{ needs.bootstrap-plan.outputs.components_json }}
        run: |
          set -euo pipefail
          changed_args=()
          while IFS= read -r component; do changed_args+=(--changed "$component"); done < <(
            node --input-type=module -e 'for (const id of JSON.parse(process.env.COMPONENTS_JSON)) console.log(id)'
          )
          output="dist/profile-candidate/$TARGET"
          node scripts/profile-release.mjs \
            --target "$TARGET" \
            --artifact-root dist/components \
            "${changed_args[@]}" \
            --source-commit "$SOURCE_COMMIT" \
            --bootstrap \
            --out "$output"
          generation=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync(process.argv[1], "utf8")).candidate_generation)' "$output/admission.json")
          node desktop/e-mate-desktop/scripts/verify-profile-boot.mjs \
            --store "$output/store" \
            --generation "$generation" \
            --base "$output/verification-base.json" \
            --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-bootstrap-candidate-${{ matrix.target }}-${{ needs.validate.outputs.source_sha }}
          path: |
            dist/profile-candidate/${{ matrix.target }}/admission.json
            dist/profile-candidate/${{ matrix.target }}/payload.json
            dist/profile-candidate/${{ matrix.target }}/envelope.json
            dist/profile-candidate/${{ matrix.target }}/verification-base.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable components and activate signed desired state
    needs: [validate, bootstrap-plan, bootstrap-components, bootstrap-composition]
    if: ${{ always() && needs.validate.result == 'success' && (!inputs.bootstrap || needs.bootstrap-composition.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: r2-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download accepted changed component payloads
        if: ${{ !inputs.bootstrap }}
        uses: actions/download-artifact@v4
        with:
          pattern: e-mate-component-*-${{ needs.validate.outputs.source_sha }}
          path: dist/components
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Download bootstrap component payloads
        if: inputs.bootstrap
        uses: actions/download-artifact@v4
        with:
          pattern: e-mate-profile-bootstrap-component-*-${{ needs.validate.outputs.source_sha }}
          path: dist/components
          merge-multiple: true

      - name: Download accepted darwin-arm64 candidate
        if: ${{ !inputs.bootstrap }}
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-candidate-darwin-arm64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/darwin-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Download accepted darwin-x64 candidate
        if: ${{ !inputs.bootstrap }}
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-candidate-darwin-x64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/darwin-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Download accepted win32-x64 candidate
        if: ${{ !inputs.bootstrap }}
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-candidate-win32-x64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/win32-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.ci_run_id }}

      - name: Download bootstrap darwin-arm64 candidate
        if: inputs.bootstrap
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-bootstrap-candidate-darwin-arm64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/darwin-arm64
      - name: Download bootstrap darwin-x64 candidate
        if: inputs.bootstrap
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-bootstrap-candidate-darwin-x64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/darwin-x64
      - name: Download bootstrap win32-x64 candidate
        if: inputs.bootstrap
        uses: actions/download-artifact@v4
        with:
          name: e-mate-profile-bootstrap-candidate-win32-x64-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-candidates/win32-x64

      - name: Publish changed bytes first and activate each target desired state last
        env:
          ECOREX_R2_ACCESS_KEY_ID: ${{ secrets.ECOREX_R2_ACCESS_KEY_ID }}
          ECOREX_R2_SECRET_ACCESS_KEY: ${{ secrets.ECOREX_R2_SECRET_ACCESS_KEY }}
          ECOREX_R2_ACCOUNT_ID: ${{ secrets.ECOREX_R2_ACCOUNT_ID }}
          EMATE_PROFILE_SIGNING_PRIVATE_KEY: ${{ secrets.EMATE_PROFILE_SIGNING_PRIVATE_KEY }}
          EMATE_PROFILE_SIGNING_KEY_ID: ${{ secrets.EMATE_PROFILE_SIGNING_KEY_ID }}
          EMATE_PROFILE_BOOTSTRAP: ${{ inputs.bootstrap }}
          EXPECTED_CHANGED_COMPONENTS_JSON: ${{ inputs.bootstrap && needs.bootstrap-plan.outputs.components_json || needs.validate.outputs.publish_components_json }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 win32-x64; do
            test -f "dist/profile-candidates/$target/admission.json"
            test -f "dist/profile-candidates/$target/payload.json"
          done
          if [[ "$ECOREX_R2_ACCESS_KEY_ID" =~ ^[0-9a-fA-F]{32}$ ]] && [[ "$ECOREX_R2_SECRET_ACCESS_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            export AWS_ACCESS_KEY_ID="$ECOREX_R2_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$ECOREX_R2_SECRET_ACCESS_KEY"
          else
            api_token="$ECOREX_R2_ACCESS_KEY_ID"
            test "${#api_token}" -ge 40
            token_id=''
            for verify_url in \
              'https://api.cloudflare.com/client/v4/user/tokens/verify' \
              "https://api.cloudflare.com/client/v4/accounts/${ECOREX_R2_ACCOUNT_ID}/tokens/verify"; do
              response="$(curl --fail --silent --show-error --header "Authorization: Bearer $api_token" "$verify_url" || true)"
              candidate="$(jq -er 'select(.success == true) | .result.id | select(test("^[0-9a-fA-F]{32}$"))' <<<"$response" 2>/dev/null || true)"
              if [[ -n "$candidate" ]]; then token_id="$candidate"; break; fi
            done
            test "$token_id" != ''
            export AWS_ACCESS_KEY_ID="$token_id"
            export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$api_token" | sha256sum | cut -d' ' -f1)"
          fi
          unset ECOREX_R2_ACCESS_KEY_ID ECOREX_R2_SECRET_ACCESS_KEY
          bootstrap_args=()
          if test "$EMATE_PROFILE_BOOTSTRAP" = true; then bootstrap_args=(--bootstrap); fi
          changed_args=()
          while IFS= read -r component; do changed_args+=(--changed "$component"); done < <(
            node --input-type=module -e 'for (const id of JSON.parse(process.env.EXPECTED_CHANGED_COMPONENTS_JSON)) console.log(id)'
          )
          node scripts/publish-profile-r2.mjs \
            --candidate dist/profile-candidates/darwin-arm64 \
            --candidate dist/profile-candidates/darwin-x64 \
            --candidate dist/profile-candidates/win32-x64 \
            --artifact-root dist/components \
            "${changed_args[@]}" \
            --receipt dist/profile-publication/r2-admission.json \
            "${bootstrap_args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: e-mate-profile-r2-admission-${{ needs.validate.outputs.source_sha }}
          path: dist/profile-publication/r2-admission.json
          if-no-files-found: error
          retention-days: 30
